# SCM folder hierarchy — platform-maintained. Two jobs:
#
#   1. BLAST RADIUS (validation-only, no expansion). A change scoped to a folder
#      WITH CHILDREN reaches every one of them. `ngfw-shared` parents both
#      `prod-edge` (production) and `GitOps` (sandbox), so a single change there
#      lands on production and the sandbox together — the largest blast radius
#      this platform can produce, and the reason ADR-0005 made this a blocking
#      prerequisite for InterfaceRequest.
#
#   2. TARGETABILITY. The Day-1 kinds (InterfaceRequest / ZoneRequest /
#      RouteRequest) name their `folder:` DIRECTLY in the intent rather than
#      going through `environment:` — their author is a network engineer for whom
#      the folder IS the intent. `targetable: false` is what stops that field
#      being a footgun: an intent naming a non-targetable folder is rejected at
#      COMPILE time, not merely tiered up by the classifier. AccessRequest is
#      unaffected — app teams keep `environment:` and never name an SCM folder.
#
# ── FOLDERS AND FIREWALLS ARE BOTH HIERARCHY, ADDRESSED DIFFERENTLY ───────
# GET /config/setup/v1/folders returns TWO kinds of entry, told apart by `type`:
#
#   {"name": "prod-edge",       "type": "container"}          <- a real folder
#   {"name": "007955000902404", "type": "on-prem",
#    "serial_number": "007955000902404", "model": "PA-VM"}    <- a DEVICE
#
# In SCM the FIREWALL IS THE LAST LEVEL OF THE HIERARCHY, and config inherits
# all the way down to it:
#
#   All -> ngfw-shared -> prod-edge -> <firewall 007955000902404>
#
# So a firewall belongs in this file — a change to `prod-edge` really does reach
# every firewall beneath it. What a firewall is NOT is a `folder=` you can
# address. It is reached with `device=<serial>`. Verified three ways on
# 2026-08-02:
#   * GET /config/network/v1/zones?folder=007955000894453 -> 400 API_I00013
#     "Folder 007955000894453 doesn't exist"
#   * the same serial as `device=` works and returns ethernet1/3, ethernet1/4
#   * pan.dev documents `folder`, `snippet` and `device` as three separate query
#     params, and the Terraform provider says "exactly one of device, folder,
#     snippet" on every resource
#
# Both halves matter, and each was got wrong in turn:
#   * v1.11.0 listed the serials under `children:` and marked them targetable —
#     an intent could name one, compile clean, and fail only at apply.
#   * v1.11.1 over-corrected by deleting them from the hierarchy entirely, which
#     discarded the true part: they ARE descendants.
# They are therefore listed below under `devices:` — hierarchy members that
# `folder:` can never name, and that `device:` addresses. See ADR-0006.
#
# The classifier is PURE (no live SCM reads), so this is declared rather than
# discovered. Keep it in step with SCM; the drift work would be the natural
# place to verify it automatically — including the `type` check that would have
# caught the mistake above.
#
# Verified live 2026-08-02 via GET /config/setup/v1/folders:
#   All -> ngfw-shared -> {prod-edge, GitOps}
#   prod-edge -> firewalls {007955000894453}
# (007955000893662 was here too until 2026-08-05, when it left SCM. Removed
#  from this file the same day it was confirmed gone — a serial listed here
#  that SCM does not have is exactly what `fwgitops verify-catalog` exists
#  to catch, and leaving it would have meant every run reporting a known
#  stale entry until people stopped reading the output.)
#
# Prisma Access built-ins (Mobile Users, Remote Networks, …) are not managed by
# this platform and are deliberately absent.
folders:
  ngfw-shared:
    # Parent of production AND sandbox. Never a target.
    children: [prod-edge, GitOps]
    targetable: false

  prod-edge:
    # Production. No child CONTAINERS, but two firewalls beneath it — a change
    # here reaches both, which is this folder's purpose rather than a hidden
    # fan-out, so it stays targetable and is not tiered up for it.
    children: []
    targetable: true
    devices:
      # Addressed as `device: <serial>` in an intent, NEVER `folder:`.
      "007955000902404":
        # The label SCM shows in its inventory — NOT the firewall's hostname
        # (that is ip-10-100-0-51, DHCP-assigned, undeclared). A re-onboard
        # RESETS it: this went to `PA-VM` on 2026-08-05 and nothing noticed.
        # `fwgitops verify-catalog` now compares it, because the reset is
        # cosmetic but is a reliable symptom of a re-registration — and a
        # re-registration wipes device-scope config.
        display_name: fw-prod-edge-2404
        model: PA-VM
        # CONNECTED 2026-08-02. A push can commit to it.
        targetable: true
  GitOps:
    # Sandbox: zero devices, nothing inherits from it. Where the provider
    # fidelity probes run (spike/*-probe).
    children: []
    targetable: true
