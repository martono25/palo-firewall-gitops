# SCM folder hierarchy — platform-maintained. Two jobs:
#
#   1. BLAST RADIUS (validation-only, no expansion). A change scoped to a folder
#      WITH CHILDREN reaches every one of them. `ngfw-shared` parents both
#      `prod-edge` (production) and `GitOps` (sandbox), so a single change there
#      lands on production and the sandbox together — the largest blast radius
#      this platform can produce, and the reason ADR-0005 made this a blocking
#      prerequisite for InterfaceRequest.
#
#   2. TARGETABILITY. The Day-1 kinds (InterfaceRequest / ZoneRequest /
#      RouteRequest) name their `folder:` DIRECTLY in the intent rather than
#      going through `environment:` — their author is a network engineer for whom
#      the folder IS the intent. `targetable: false` is what stops that field
#      being a footgun: an intent naming a non-targetable folder is rejected at
#      COMPILE time, not merely tiered up by the classifier. AccessRequest is
#      unaffected — app teams keep `environment:` and never name an SCM folder.
#
# ── ONLY CONTAINERS BELONG IN THIS FILE ───────────────────────────────────
# GET /config/setup/v1/folders returns TWO kinds of entry, told apart by `type`:
#
#   {"name": "prod-edge",       "type": "container"}          <- a real folder
#   {"name": "007955000894453", "type": "on-prem",
#    "serial_number": "007955000894453", "model": "PA-VM"}    <- a DEVICE
#
# A device is NOT a folder, however much the listing looks like one. Verified
# three ways on 2026-08-02:
#   * GET /config/network/v1/zones?folder=007955000894453 -> 400 API_I00013
#     "Folder 007955000894453 doesn't exist"
#   * the same serial as `device=` works and returns ethernet1/3, ethernet1/4
#   * pan.dev documents `folder`, `snippet` and `device` as three separate query
#     params, and the Terraform provider says "exactly one of device, folder,
#     snippet" on every resource
#
# So device entries must never be listed here. v1.11.0 briefly did list them,
# marked targetable — an intent could have named one, compiled clean, and failed
# only at apply. See ADR-0006's correction note. Targeting a single device needs
# a `device:` scope, which this platform does not implement yet.
#
# The classifier is PURE (no live SCM reads), so this is declared rather than
# discovered. Keep it in step with SCM; the drift work would be the natural
# place to verify it automatically — including the `type` check that would have
# caught the mistake above.
#
# Verified live 2026-08-02 via GET /config/setup/v1/folders (containers only):
#   All -> ngfw-shared -> {prod-edge, GitOps}
# prod-edge additionally has two `on-prem` DEVICES attached (007955000893662,
# 007955000894453). They are not children in the folder sense and are not listed
# below; a change to prod-edge reaching both firewalls is that folder's whole
# purpose, not a hidden fan-out.
#
# Prisma Access built-ins (Mobile Users, Remote Networks, …) are not managed by
# this platform and are deliberately absent.
folders:
  ngfw-shared:
    # Parent of production AND sandbox. Never a target.
    children: [prod-edge, GitOps]
    targetable: false

  prod-edge:
    # Production. No child CONTAINERS — its two firewalls are `on-prem` device
    # entries, not folders.
    children: []
    targetable: true

  GitOps:
    # Sandbox: zero devices, nothing inherits from it. Where the provider
    # fidelity probes run (spike/*-probe).
    children: []
    targetable: true
