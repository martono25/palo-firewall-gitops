# Logical interface ROLE -> the object name at each scope.
#
# WHY THIS EXISTS. The same interface has two names in SCM, and which one is
# correct depends on the scope you are writing to (ADR-0005):
#
#   folder=ngfw-shared   $eth-local (default_value: ethernet1/4)   35479f59-…
#   device=<serial>      ethernet1/4                               35479f59-…
#
# An intent that hardcodes either one is wrong somewhere. `interface:
# ethernet1/4` breaks the moment it targets a folder; `interface: $eth-local`
# breaks the moment it targets a firewall. Worse, the physical name is a
# property of the AWS topology — it changed once already in this project's
# lifetime and would have silently invalidated every intent naming it.
#
# So an intent names the ROLE (`local`, `internet`) and this catalog resolves it
# per scope, at LOAD time, the same way catalog/routers.yaml supplies VRF
# membership. The compiler stays pure and the requester never types a physical
# port.
#
# ── WHERE EACH NAME COMES FROM ────────────────────────────────────────────
# `$eth-local` and `$eth-internet` are SCM DEFAULTS. They are defined once in
# `ngfw-shared` and INHERITED by every firewall beneath it — this platform does
# not create them and should not rename them.
#
# The device-scope value below MIRRORS the SCM variable's `default_value`; it is
# not a name we choose. Verified live 2026-08-03:
#
#   GET /config/network/v1/ethernet-interfaces?folder=ngfw-shared
#     $eth-internet  default_value: ethernet1/3
#     $eth-local     default_value: ethernet1/4
#
# So SCM owns the mapping and this file restates it, because the classifier and
# compiler are PURE and cannot read SCM. If someone changes a `default_value` in
# SCM, change it here in the same PR — a stale entry here writes the wrong port.
#
# ── THE PHYSICAL NAME IS NOT FREE ─────────────────────────────────────────
# On AWS a VM-Series interface exists only when an ENI sits at the matching
# device index (eth0=mgmt, ethN=ethernet1/N), and the ENI limit scales with
# instance SIZE. Naming ethernet1/3 and ethernet1/4 therefore forces a 5th ENI
# and a 16-vCPU instance — which also auto-scaled the licence tier from
# VM-SERIES-4 to VM-SERIES-16 (verified 2026-08-03), roughly 4x the credits.
#
# A production firewall here is 1 mgmt + 2 dataplane = 3 ENIs, which fits
# m5.xlarge / VM-SERIES-4. Mapping the roles to ethernet1/1 and ethernet1/2
# would remove the oversize entirely. THE MAPPING BELOW IS THE COST DRIVER —
# keep that in view when editing it.
#
# Verified live 2026-08-03 (`show interface all`, device scope):
#   ethernet1/3  up  06:e5:9a:8b:d8:c9  zone internet
#   ethernet1/4  up  06:ca:54:97:6c:b7  zone local
# ── WHO CREATES THE FOLDER-SCOPE VARIABLE (`create_in`) ───────────────────
# A folder-scope zone can only bind an interface object that exists AT THAT
# SCOPE. Binding a literal port is refused (`'ethernet1/2' is not a valid
# reference`), so the `$`-variable must exist before any zone in that folder can
# carry traffic.
#
# `$eth-local` and `$eth-internet` exist by luck of setup: they are SCM defaults
# defined in `ngfw-shared` and inherited. A NEW folder inherits them too, but a
# NEW ROLE has no such default — which is why `$eth-dmz` had to be created by
# hand, and why "Day-1 provisioning as GitOps" was not true of a folder that
# starts empty.
#
# `create_in` maps FOLDER -> the physical port that folder's variable resolves
# to (`default_value`). `fwgitops folder-interfaces` materialises exactly these,
# into the folder's CI-owned Terraform root — so adding a role later is a
# reviewed PR with a plan, not a manual apply from whichever laptop holds a
# run-once root's local state.
#
# OPT-IN, and that direction is deliberate. Omitting it means "this variable
# comes from somewhere else" — the safe default. Creating `$eth-local` in
# `prod-edge` would SHADOW the object inherited from `ngfw-shared` with a new
# one, which is a per-folder override of the interface every firewall resolves
# `local` through. Never list an inherited SCM default here.
interfaces:
  local:
    description: Inside / trust segment.
    # Name at FOLDER scope — the SCM folder variable.
    folder: $eth-local
    # No `create_in`: an SCM default inherited from ngfw-shared. NOT ours.
    # Name at DEVICE scope, per firewall. A firewall absent here cannot be
    # targeted for this role: fail closed rather than guess a port.
    devices:
      "007955000901881": ethernet1/1

  internet:
    description: Outside / untrust segment.
    folder: $eth-internet
    # No `create_in`: an SCM default inherited from ngfw-shared. NOT ours.
    devices:
      "007955000901881": ethernet1/2

  dmz:
    description: >-
      Screened segment. The first role whose folder-scope variable this platform
      CREATES rather than inherits — `$eth-local` and `$eth-internet` are SCM
      defaults in `ngfw-shared`, `$eth-dmz` is declared by
      terraform/bootstrap-scm-folder. A zone can only bind a variable that
      exists at its scope (a literal port name is refused as an invalid
      reference), so without that bootstrap entry this role would be
      unbindable.
    folder: $eth-dmz
    # CREATED BY THIS PLATFORM, unlike the two above. folder -> default_value.
    # The port must agree with every mapped firewall in that folder; a
    # disagreement is a rejection, not a coin flip (see catalog.py).
    create_in:
      prod-edge: ethernet1/3
    # NOT universal. `local` and `internet` are expected on every firewall here,
    # so one missing them is a catalog gap and the coverage test says so. A DMZ
    # port is a property of one site's wiring — 4453 has an ENI at device index
    # 2, and the next firewall need not.
    #
    # KEPT DELIBERATELY while only one firewall exists. Right now every role
    # covers the single firewall, so this marking changes nothing and looks
    # removable; it earns its keep the moment a SECOND firewall is added without
    # a DMZ port, which is when the alternative would be either a coverage-test
    # failure or a GUESSED port. Guessing physical ports is what this file exists
    # to prevent.
    #
    # It does not loosen anything either way: `resolve()` still raises for an
    # unmapped firewall, so an intent naming one with `interface: dmz` is
    # rejected at load rather than compiling into a port that may not exist.
    site_specific: true
    devices:
      # ethernet1/2 = ENI device index 2, 10.100.1.110/24. A firewall absent
      # from this map cannot be targeted for this role — fail closed rather than
      # guess a port that may have no ENI behind it.
      "007955000901881": ethernet1/3
