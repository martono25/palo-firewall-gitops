# Phase-1 environment resolution map (the thin catalog).
# environment -> SCM folder + default zone-pair. Per-IP zone inference and the
# full app/service catalog arrive in Phase 2 (see docs/DESIGN.md).
#
# This file is platform-maintained config; changes to it are PRs.
prod:
  folder: prod-edge
  from_zone: local      # SCM/NGFW default zone (exists on the device)
  to_zone: internet     # SCM/NGFW default zone (exists on the device)

  # Other zones that ALREADY EXIST in this folder and may be referenced by a
  # rule without a ZoneRequest. Verified against the live tenant 2026-07-31 via
  # GET /config/network/v1/zones?folder=prod-edge — the folder carries seven
  # zones, but only the default pair above was declared, so a rule referencing
  # e.g. `proxy` was rejected at compile time as undeclared.
  #
  # List ONLY zones that genuinely exist in SCM. A zone that does not exist
  # still requires a ZoneRequest — that is what the cross-kind check is for.
  baseline_zones:
    - zone-internal
    - zone-to-hub
    - zone-to-branch
    - zone-to-pa-hub
    - proxy
