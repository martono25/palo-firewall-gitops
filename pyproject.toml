[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fwgitops"
version = "1.26.0"
description = "GitOps firewall automation for Palo Alto Strata Cloud Manager"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6"]

[project.scripts]
fwgitops = "fwgitops.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/fwgitops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
