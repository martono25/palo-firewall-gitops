# ─────────────────────────────────────────────────────────────────────────
# Applies the reviewed desired-state after merge.
#
# WHAT ACTUALLY GATES A CHANGE HERE — measured 2026-08-09, because this header
# claimed a control that does not exist:
#
#   * THE RISK GATE (real, and currently the only one). `fwgitops classify
#     --gate` fails the job when any change exceeds the max-auto tier, which a
#     push pins to LOW. It has been holding since 2026-08-05: `REQ-2026-0803`
#     classifies HIGH (`default_route`), so every push-triggered apply stops
#     there. Raising it requires an explicit, logged `workflow_dispatch`.
#
#   * REQUIRED REVIEWERS ON `firewall-apply` — CLAIMED HERE UNTIL v1.39.0, AND
#     NEVER PRESENT. `GET /environments/firewall-apply` returns
#     `"protection_rules": []`. Environment protection needs Pro/Team/Enterprise
#     on a PRIVATE repository, and this one is private on a personal account, so
#     it was never configurable — and nothing said so. The header asserted
#     "human approval on EVERY change" over a control that had never been
#     enabled, which is the same claimed-but-not-operating defect this project
#     removed from `expires`, from `DESIGN.md`, and from the bundle's own CM-5.
#
#     This is why evidence bundles record no approver: nothing requires an
#     approval, so `controls_not_evidenced` names CM-5 rather than claiming it.
#     Tracked in TODOS.md with the options; NOT quietly re-asserted here.
#
# PHASE 2 slots for tier-driven routing (LOW auto / HIGH review / CRITICAL
# security sign-off) and the window-aware scheduler are marked below.
# ─────────────────────────────────────────────────────────────────────────
name: apply

on:
  # Auto-apply on merge to main. Fail-closed: a push runs the risk gate at LOW
  # (see the gate step's `|| 'LOW'`), so only LOW-risk changes auto-apply; HIGH/
  # CRITICAL require an explicit manual dispatch with a higher max_auto_tier.
  push:
    branches: [main]
    paths:
      - "intent/**"
      - "catalog/**"
      - "terraform/**"
  # Manual override path: dispatch with a higher tier to apply HIGH/CRITICAL.
  workflow_dispatch:
    inputs:
      max_auto_tier:
        description: "Highest risk tier allowed to apply without escalation (fail-closed gate)"
        type: choice
        options: [LOW, HIGH, CRITICAL]
        default: LOW

permissions:
  # WRITE so the run can commit its evidence bundles back to main. The audit
  # record belongs in the source of truth, not in an artifact that expires:
  # evidence.py has always declared `evidence/<folder>/<REQ-id>.json (committed;
  # Git = SSoT)` and until now the workflow only uploaded it.
  #
  # Safe against a trigger loop by construction: this workflow's `paths:` filter
  # lists intent/, catalog/ and terraform/ only, so a push touching evidence/
  # matches nothing and starts no run.
  contents: write
  id-token: write # OIDC to cloud for the TF state backend (Arch-2)
  # READ-ONLY, and only so the evidence bundle can name WHO APPROVED. Without
  # these the approvals API 403s, `--approver` is passed nothing, and the bundle
  # declines to claim NIST CM-5 — which is the honest outcome, but a silent one,
  # so the collection step warns rather than letting it pass unnoticed.
  pull-requests: read
  actions: read

# Never cancel an in-flight apply. Intentional mid-apply cancellation is handled
# by the candidate/commit boundary (discard candidate), NOT by killing the job.
concurrency:
  group: fw-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── PHASE 2 (slot): classify each change and route to the right gate ──────
  # classify:
  #   outputs: { tier: LOW|HIGH|CRITICAL }
  #   run: fwgitops classify ...        # risk classifier (Phase 2, fail-closed)
  # Then `apply` picks its `environment:` from the tier:
  #   LOW      -> no required reviewer (auto)
  #   HIGH     -> firewall-review  (folder CODEOWNERS)
  #   CRITICAL -> firewall-security (dual-control), maintenance-window only
  # and the window-aware scheduler gates WHEN (tier-driven cadence, 1:1 isolation).

  apply:
    runs-on: ubuntu-latest
    # NOT an approval gate — see the header. This environment carries no
    # protection rules, so naming it buys deployment-history grouping and a
    # place to scope secrets, nothing more. Kept because the protection can be
    # switched on here the day the plan allows it; documented because a reader
    # who sees `environment:` reasonably assumes it stops something.
    environment: firewall-apply
    # SCM auth for BOTH the scm Terraform provider and `fwgitops push`. Each does
    # its own client_credentials -> JWT exchange, so no separate token step.
    env:
      SCM_CLIENT_ID: ${{ secrets.SCM_CLIENT_ID }}
      SCM_CLIENT_SECRET: ${{ secrets.SCM_CLIENT_SECRET }}
      SCM_SCOPE: ${{ secrets.SCM_SCOPE }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The BASELINE intent tree is needed to record a REMOVAL: a deleted
          # intent is absent from the checkout, so with a shallow clone there is
          # nothing left to build its evidence from. `classify` has tiered
          # removals since v1.30.0 — assessed but unrecorded was a strange place
          # to stop.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e .

      # Compile intents -> tfvars FRESH so the apply always reflects the current
      # intents (source of truth), not a possibly-stale committed tfvars. Compile
      # is deterministic/byte-stable, so this matches the reviewed output when the
      # author recompiled in the PR, and self-corrects if they forgot. Fail-closed:
      # any invalid intent aborts here, before anything is applied.
      # A root must mirror the module ATTRIBUTE FOR ATTRIBUTE: Terraform
      # DISCARDS an undeclared object attribute at the module boundary silently
      # — no warning, exit 0 — so a drifted root does not fail, it quietly stops
      # delivering part of every intent. Fails the PR instead.
      - name: Terraform roots mirror the module
        run: fwgitops scaffold-root --check

      # MATERIALISE FOLDER INTERFACE VARIABLES FIRST, always before compile.
      # A folder's `$`-interface VARIABLES must exist before any zone in that
      # folder can bind one, and a GREENFIELD folder has no intents at all — so
      # this cannot be driven off the intent tree without being circular. The
      # source is catalog/interfaces.yaml, which is platform-maintained and
      # changed by PR, so a requester still cannot conjure a physical port.
      - name: Materialise folder interface variables
        run: fwgitops folder-interfaces

      - name: Compile intents
        run: fwgitops compile

      # Every folder the compiler emitted MUST have a Terraform root. Both loops
      # below start with `[ -f "$dir/main.tf" ] || continue`, so a folder with
      # tfvars but no Terraform is SKIPPED, not caught — the plan never runs, the
      # undeclared-variable grep never runs, and the config silently never reaches
      # the device. `fwgitops compile` now fails closed on this too; this catches
      # hand-committed tfvars and terraform/ deletions the compile cannot see.
      - name: Guard — emitted tfvars must have a Terraform root
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in terraform/*/*.auto.tfvars.json; do
            d=$(dirname "$f")
            if [ ! -f "$d/main.tf" ]; then
              echo "::error::$(basename "$d"): compiled $(basename "$f") but there is no Terraform root in $d — the config would never be applied."
              exit 1
            fi
          done

      # Fail-closed RISK GATE (Phase 2): block the apply if any change exceeds the
      # max-auto tier. On a push (merge) the input is unset, so it defaults to LOW
      # — only LOW-risk changes auto-apply; HIGH/CRITICAL require an explicit,
      # logged manual dispatch with a higher tier. This tier gate does NOT need
      # required-reviewers (works on any plan).
      - name: Risk gate (fail-closed)
        run: fwgitops classify intent --gate "${{ inputs.max_auto_tier || 'LOW' }}"

      - uses: hashicorp/setup-terraform@v4

      # AWS creds for the S3 state backend (Arch-2), via OIDC — no long-lived keys.
      # WORKING as of 2026-08-09: the OIDC role is created, AWS_OIDC_ROLE_ARN is
      # set, and a dispatched pr-validate ran this step and `terraform plan`
      # against both roots successfully. The old "⬜ SETUP REMAINING" note here
      # outlived the setup by weeks and made a working backend read as a stub.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-southeast-1

      # Per folder: stage via terraform (candidate), then push to make it live.
      # The push FAILS CLOSED if the candidate was edited outside our automation.
      # One folder at a time preserves 1:1 isolation / clean per-change rollback.
      # apply.yml writes plan-$folder.txt for its contract guard. It does not
      # publish them today, but redacting keeps the invariant "no file this
      # workflow writes contains a credential" true regardless of what a future
      # step does with them.
      - name: terraform apply (stage) + SCM push — per folder
        run: |
          set -euo pipefail
          # APPLY ORDER comes from the registry (ADR-0002's ordered chain), not
          # from a glob. `for dir in terraform/*/` was alphabetical: on this
          # tenant device-<serial> sorts before prod-edge, so interfaces happened
          # to apply before the routes and rules that depend on them — correct by
          # accident, and it would silently invert on a rename.
          #
          # `apply-order` also FAILS (exit 2) when kinds are interleaved across
          # roots such that no whole-root order works, rather than picking one.
          for folder in $(fwgitops apply-order --out terraform); do
            dir="terraform/$folder/"
            # Skip run-once bootstraps (local state) and the shared module dir.
            case "$folder" in bootstrap-* | github-oidc | modules) continue ;; esac
            [ -f "$dir/main.tf" ] || continue
            # ANY compiled tfvars, not just RULES. This read
            # `[ -f "$dir/rules.auto.tfvars.json" ]` until v1.39.2, so a scope
            # holding only interfaces, zones or routes was skipped ENTIRELY and
            # the job still reported success. Measured on the first successful
            # apply (2026-08-09, run 31304463821): `device-007955000894453` holds
            # three InterfaceRequests and no rules, printed "no rules … — skip",
            # and Terraform never ran against it.
            #
            # Nothing broke that day only because those interfaces had already
            # been applied by hand. Any LATER change to a device-scoped interface
            # would silently never reach the firewall — and it is the FIRST link
            # in ADR-0002's ordered chain, so the ordering the loop exists to
            # honour was not being executed for that scope at all.
            #
            # Same defect class as `_compile_intents` returning AccessRequest
            # only, and as evidence bundles being rules-shaped: a rules-keyed
            # guard inside a multi-kind pipeline.
            shopt -s nullglob
            set -- "$dir"*.auto.tfvars.json
            shopt -u nullglob
            [ "$#" -gt 0 ] || { echo "nothing compiled for $folder — skip"; continue; }
            echo "::group::apply+push $folder"
            ./terraform/make-backend.sh "$folder"
            terraform -chdir="$dir" init -input=false -backend-config=backend.hcl

            # FAIL-CLOSED CONTRACT GUARD — must run on the APPLY path too.
            # pr-validate has the same grep, but a guard that only protects the
            # preview protects nothing on any route that reaches main without a
            # green pr-validate: direct push, admin merge, workflow_dispatch, a
            # merge queue that skipped it, or terraform/ edited while the PR gate
            # was red. Terraform exits 0 on an undeclared auto-tfvars variable, so
            # without this the apply silently drops the config and reports success.
            # Authoritative check is tfcontract.check_contract at compile time;
            # this backstops hand-edited tfvars and terraform/ changes.
            terraform -chdir="$dir" plan -input=false -no-color 2>&1 | tee "plan-$folder.txt"
            if grep -q "Value for undeclared variable" "plan-$folder.txt"; then
              echo "::error::$folder: compiled tfvars set a variable the Terraform module does not declare — the config would be SILENTLY IGNORED. Refusing to apply."
              exit 1
            fi

            # TAGS FIRST. The API validates tags as REFERENCES and rejects
            # free-form strings (INVALID_REFERENCE), so a rule cannot apply
            # before its tags exist — and Terraform no longer creates them
            # (ADR-0009: it ran a tag DESTROY before the rule UPDATE that
            # released it and 409'd). Idempotent; creates only what is missing.
            fwgitops tags ensure "$folder"

            # -parallelism=1 REQUIRED: the scm provider cannot handle concurrent
            # token acquisition (spike 2026-07-19) — serial apply only.
            terraform -chdir="$dir" apply -input=false -auto-approve -parallelism=1 \
              2>&1 | tee "apply-$folder.txt"

            # DID THE APPLY ACTUALLY CHANGE ANYTHING? Read from what it DID, not
            # from a prediction made before it ran.
            #
            # v1.39.3 derived this from `terraform plan -detailed-exitcode`, and
            # on run 31308877939 that produced a WRONG answer: the plan file said
            # `Plan: 3 to add`, the apply created three resources, and the push
            # was skipped anyway — leaving the new rule staged in SCM and never
            # committed, which is precisely the applied-but-unpushed state
            # `devicesync.py` documents as invisible. The construct returns 2
            # correctly in isolation and the mechanism was never reproduced, so
            # the dependency on it is removed rather than patched around: a fix
            # nobody can explain is not a fix.
            #
            # `Apply complete! Resources: 0 added, 0 changed, 0 destroyed.` is
            # terraform's own report of the run that just happened. Absent
            # entirely (unexpected output, a format change) means UNKNOWN, and
            # unknown pushes.
            staged=1
            if grep -q "Resources: 0 added, 0 changed, 0 destroyed" "apply-$folder.txt"; then
              staged=0
            elif ! grep -q "Apply complete! Resources:" "apply-$folder.txt"; then
              echo "::warning::$folder: could not read the apply summary — pushing rather than assuming nothing changed"
            fi
            # ADR-0003 enrich, NARROWED in v1.16.0 — it now applies ORDERING only.
            # The provider silently dropped application /
            # profile_setting / log_setting / ordering on security rules (verified
            # live on v1.0.11 + 1.0.12-beta.3). This sets them via the SCM API on
            # the just-applied rules — landing in the SAME candidate, so the push
            # below commits skeleton + enrichment as one atomic change. Fail-closed:
            # if enrich errors, we never push.
            # ENRICH IS RULES-ONLY, so it is conditional on rules — but the
            # APPLY above is not. Conflating the two is what skipped the whole
            # scope; the guard belongs on the rules-shaped step, not on the loop.
            moved=0
            if [ -f "$dir/rules.auto.tfvars.json" ]; then
              fwgitops enrich "$folder" | tee "enrich-$folder.txt"
              # enrich prints a human line then a JSON record. A MOVE stages a
              # change that `terraform plan` cannot see, so it counts toward
              # "did we stage anything" independently of the apply summary.
              moved=$(tail -1 "enrich-$folder.txt" \
                      | jq '[.records[]? | select(.moved)] | length' 2>/dev/null || echo "")
              if [ -z "$moved" ]; then
                # UNKNOWN MEANS PUSH. Skipping on an unreadable enrich output
                # would leave a move staged and uncommitted — the
                # applied-but-unpushed state `devicesync.py` documents as
                # INVISIBLE to every check here. An unnecessary push costs a
                # version entry; a missed one costs a silent divergence between
                # SCM and the firewall.
                echo "::warning::$folder: could not read enrich output — pushing rather than assuming nothing moved"
                moved=1
              fi
            fi
            # Atomic commit boundary (Topic-1): terraform only STAGES config; this
            # push makes it live (scm provider has no push). The push is
            # admin-scoped (defaults to SCM_CLIENT_ID) so a shared-candidate folder
            # with out-of-band edits is safe — we only ever commit our own changes.
            # --scope-dir, NOT "$folder": `device-<serial>` is a Terraform root
            # DIRECTORY, and SCM rejects it as a folder ("Folder
            # device-<serial> doesn't exist"). Stripping the prefix here instead
            # would put a second copy of the mapping in YAML — the duplication
            # that broke the drift job in v1.34.2.
            #
            # ONLY PUSH IF WE STAGED SOMETHING. Measured 2026-08-09: three
            # consecutive pushes with NOTHING staged each minted a config version
            # (v75 at 08:51, v76/v77 at 09:29–09:30) while terraform reported
            # `0 added, 0 changed, 0 destroyed` every time. So an empty push is
            # not free — it appends to the tenant's version history, the record
            # an assessor is being asked to trust, and it makes "did my push
            # commit anything?" unanswerable from the job: the empty job and the
            # real one are byte-identical apart from the id.
            #
            # This also RETIRES the direction TODOS proposed (derive noop by
            # diffing config versions): a version is created either way, so
            # versions cannot distinguish. What IS knowable is whether WE staged
            # anything — plan's exit code plus enrich's move count — and since
            # the push is admin-scoped it can only ever commit our own changes.
            if [ "${staged:-1}" -gt 0 ] || [ "${moved:-0}" -gt 0 ]; then
              fwgitops push --scope-dir "$folder"
            else
              echo "nothing staged for $folder (apply: 0 changed, enrich: no moves)"
              echo "  — skipping push, which would mint an empty commit job"
            fi

            # SWEEP AFTER THE PUSH, and never in the same operation as the rule
            # change that released the tag — that ordering IS the fix (ADR-0009).
            #
            # NON-FATAL. By here the firewall is already updated, so failing the
            # job would turn leftover garbage into a red apply for a change that
            # succeeded. An unreferenced tag is inert. The warning is the whole
            # signal, though: nothing else reports these, so a sweep that quietly
            # stops working accumulates unnoticed.
            fwgitops tags sweep "$folder" \
              || echo "::warning::$folder: tag sweep failed — unreferenced gitops: tags may remain"
            echo "::endgroup::"
          done

      # Confirmation a requester can read on the run page (Actions -> this run ->
      # Summary) without opening SCM: which rules are now live in which folder.
      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Firewall rules deployed"
            echo ""
            echo "Result: **${{ job.status }}**"
            for f in terraform/*/rules.auto.tfvars.json; do
              [ -f "$f" ] || continue
              folder=$(basename "$(dirname "$f")")
              echo ""
              echo "**Folder \`$folder\`:**"
              jq -r '.security_rules | keys[] | "- `" + . + "`"' "$f" 2>/dev/null || true
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Evidence (Phase 2): one NIST-mapped bundle per applied change, carrying
      # the risk verdict, intent/tfvars hashes, and CI provenance (GITHUB_* env).
      # Uploaded as a run artifact — the audit record for this apply.
      # Materialise the PREVIOUS revision's intent tree and the text that landed
      # on main. `github.event.before` is the commit this push replaced, which
      # for a squash-merged PR is the pre-merge tip; the head commit message is
      # the squashed PR title + body, which is where the `Removes:` trailer that
      # `pr-validate` checked ends up.
      # RUNS ON DISPATCH TOO. This was `if: github.event_name == 'push'` until
      # v1.39.2, and the condition was inverted against how removals actually
      # reach production: a route or zone removal classifies HIGH, and HIGH
      # REQUIRES a manual dispatch to clear the risk gate — so the one case that
      # most needs a tombstone was the one case that could not produce one. The
      # first dispatched apply (2026-08-09) printed "no --baseline, so REMOVALS
      # were not examined", which is the note doing its job and the workflow not
      # doing its own.
      #
      # `github.event.before` is empty on a dispatch, so the previous commit is
      # resolved from git instead. `fetch-depth: 0` above makes that possible.
      - name: Materialise the baseline intent tree
        env:
          # VIA env, never spliced into the script — see pr-validate.yml. A commit
          # message is still text someone else wrote.
          BEFORE: ${{ github.event.before }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # On a DISPATCH there is no head_commit, so the trailer comes from the
          # tip's own message — which for a squash-merged PR is still the title
          # and body `pr-validate` checked.
          if [ -n "$HEAD_MESSAGE" ]; then
            printf '%s\n' "$HEAD_MESSAGE" > /tmp/change-message.txt
          else
            git log -1 --format=%B > /tmp/change-message.txt
          fi

          # `github.event.before` on a push; the parent of the tip on a dispatch.
          base="$BEFORE"
          if [ -z "$base" ]; then
            base=$(git rev-parse --verify --quiet HEAD^ || true)
          fi

          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            mkdir -p /tmp/base-intent
            git archive "$base" intent | tar -x -C /tmp/base-intent
            echo "BASELINE=/tmp/base-intent/intent" >> "$GITHUB_ENV"
            echo "baseline intent tree from $base"
          else
            # A root commit is the only legitimate way to get here, and it has no
            # predecessor, so there is nothing to have removed. Still a warning:
            # "no removals" and "could not look" must not be the same silence.
            echo "::warning::no base commit resolved — REMOVALS will produce no evidence"
          fi

      # WHO APPROVED. The bundle claimed NIST CM-5 — "access restrictions for
      # change", who MAY approve versus who DID — while `approvers` was hard-coded
      # empty and nothing ever passed one. Collected here because the record
      # builder must not make network calls; it takes facts, it does not discover
      # them.
      #
      # TWO SOURCES, kept apart. Reviewing the proposed change and releasing the
      # deployment are different acts, and one person doing both is a finding
      # rather than a detail — flattening them to a list of logins would hide it.
      - name: Collect approval evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          : > /tmp/approvers.txt

          # `commits/<sha>/pulls` resolves the SQUASHED merge commit back to its
          # PR. Parsing "(#123)" out of the subject would be guessing; a title can
          # contain that text without being a merge.
          pr_json=$(gh api "repos/$REPO/commits/$SHA/pulls" 2>/dev/null || echo '[]')
          pr_url=$(printf '%s' "$pr_json" | jq -r '.[0].html_url // empty')
          pr_num=$(printf '%s' "$pr_json" | jq -r '.[0].number // empty')
          if [ -n "$pr_url" ]; then
            echo "GITHUB_PR_URL=$pr_url" >> "$GITHUB_ENV"
          fi

          # ONLY WELL-FORMED LOGINS. `sed` appends the route to whatever arrives,
          # so any stray line — an API error printed to stdout, a warning, an
          # empty `[]` from a filter that did not apply — would become an
          # APPROVER NAME in a compliance record. A fabricated approver is far
          # worse than a missing one, so anything that is not a GitHub login
          # (alphanumerics and hyphens, max 39) is dropped.
          logins() { grep -E '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$' || true; }

          if [ -n "$pr_num" ]; then
            gh api "repos/$REPO/pulls/$pr_num/reviews" --paginate \
              --jq '.[] | select(.state == "APPROVED") | .user.login' 2>/dev/null \
              | logins | sort -u | sed 's/$/:pull_request_review/' >> /tmp/approvers.txt || true
          fi

          # The `firewall-apply` environment gate — who released THIS run.
          gh api "repos/$REPO/actions/runs/$RUN_ID/approvals" \
            --jq '.[] | select(.state == "approved") | .user.login' 2>/dev/null \
            | logins | sort -u | sed 's/$/:deployment_gate/' >> /tmp/approvers.txt || true

          count=$(grep -c . /tmp/approvers.txt || true)
          echo "collected ${count:-0} approval(s)"
          if [ "${count:-0}" -eq 0 ]; then
            # NOT a failure — an unapproved auto-apply of a LOW change is the
            # designed path. But it must be VISIBLE, because the bundle silently
            # dropping CM-5 is otherwise indistinguishable from a broken token.
            echo "::warning::no approver recorded — bundles will NOT claim NIST CM-5"
          fi

      - name: Generate evidence bundles
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r a; do
            [ -n "$a" ] && args+=(--approver "$a")
          done < /tmp/approvers.txt
          if [ -n "${BASELINE:-}" ]; then
            args+=(--baseline "$BASELINE" --change-message /tmp/change-message.txt)
          fi
          fwgitops evidence intent --out evidence --status applied \
            ${args[@]+"${args[@]}"}

      - name: Upload evidence bundles
        uses: actions/upload-artifact@v7
        with:
          name: evidence-bundles
          path: evidence/

      # COMMIT the bundles. The artifact above is convenience; this is the audit
      # record. A GitHub artifact expires on the default retention, so an audit
      # trail that lives only there has a TTL — which is not an audit trail.
      #
      # Rebase-and-retry because applies queue (concurrency group) and two runs
      # can race to push. A rebase CONFLICT is left to fail the job: two runs
      # disagreeing about the same bundle is worth a human, not an auto-resolve
      # that silently drops one change's record.
      - name: Commit evidence bundles
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/
          if git diff --cached --quiet; then
            echo "no evidence changes to commit"
            exit 0
          fi
          git commit -m "evidence: bundles for ${GITHUB_SHA:0:12}" \
                     -m "Generated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "evidence committed on attempt $attempt"
              exit 0
            fi
            echo "push race on attempt $attempt — retrying"
            sleep 5
          done
          echo "::error::could not commit evidence bundles after 3 attempts"
          exit 1
