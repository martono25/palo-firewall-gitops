# ─────────────────────────────────────────────────────────────────────────
# UNVALIDATED SCAFFOLDING. Applies the reviewed desired-state after merge.
#
# PHASE 1: human approval on EVERY change via the `firewall-apply` environment's
# required reviewers (there is no risk classifier yet). PHASE 2 slots for the
# tier-driven routing (LOW auto / HIGH review / CRITICAL security sign-off) and
# the window-aware scheduler are marked below. Auth (T1) + backend (Arch-2) are
# stubbed with `# VERIFY:`.
# ─────────────────────────────────────────────────────────────────────────
name: apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "intent/**"
      - "catalog/**"

permissions:
  contents: read
  id-token: write # OIDC to cloud for the TF state backend (Arch-2)

# Never cancel an in-flight apply. Intentional mid-apply cancellation is handled
# by the candidate/commit boundary (discard candidate), NOT by killing the job.
concurrency:
  group: fw-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── PHASE 2 (slot): classify each change and route to the right gate ──────
  # classify:
  #   outputs: { tier: LOW|HIGH|CRITICAL }
  #   run: fwgitops classify ...        # risk classifier (Phase 2, fail-closed)
  # Then `apply` picks its `environment:` from the tier:
  #   LOW      -> no required reviewer (auto)
  #   HIGH     -> firewall-review  (folder CODEOWNERS)
  #   CRITICAL -> firewall-security (dual-control), maintenance-window only
  # and the window-aware scheduler gates WHEN (tier-driven cadence, 1:1 isolation).

  apply:
    runs-on: ubuntu-latest
    # PHASE 1: single protected environment = human approval on every change.
    environment: firewall-apply
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e .

      - uses: hashicorp/setup-terraform@v4

      # VERIFY (T1): short-lived SCM token, same as pr-validate.
      - name: Mint short-lived SCM token
        run: |
          echo "TODO(T1) exchange service-account creds for a short-lived token; export SCM_* env"

      # Applies the COMMITTED tfvars (exactly what was reviewed). The module's
      # depends_on enforces objects-before-rules. One folder at a time keeps the
      # 1:1 isolation / clean per-change rollback.
      - name: terraform apply (stage) — per folder
        run: |
          set -euo pipefail
          for dir in terraform/*/; do
            [ -f "$dir/main.tf" ] || continue
            echo "::group::apply $dir"
            terraform -chdir="$dir" init -input=false
            # -parallelism=1 is REQUIRED: the scm provider cannot handle
            # concurrent token acquisition and fails with a misleading
            # "unauthorized_client" auth error under the default parallelism.
            # Confirmed in the spike (2026-07-19) — plan works, parallel apply
            # fails, serial apply succeeds.
            terraform -chdir="$dir" apply -input=false -auto-approve -parallelism=1
            echo "::endgroup::"
          done

      # ── Candidate/commit boundary (Topic-1 rollback) — CONFIRMED REQUIRED ──
      # Spike finding (2026-07-19): the scm provider has NO push/commit resource
      # (0 of 129 resources, 0 of 252 data sources). `terraform apply` only STAGES
      # config in SCM; a separate push is required to make it live. SCM's push
      # target is the FOLDER.
      #
      # Because push is folder-scoped it commits EVERYTHING staged in that folder,
      # not just our change. Two safeguards:
      #   1. The job-level `concurrency` group above serializes applies, so our own
      #      pipeline never stages two changes into a folder at once (preserves the
      #      1:1 isolation and clean per-change rollback).
      #   2. FAIL CLOSED before pushing: if anything unexpected is staged in the
      #      folder (e.g. an out-of-band GUI edit), abort rather than commit
      #      someone else's unreviewed change under our audit trail. That staged
      #      delta is Level-1 drift and must go through the drift flow instead.
      # Orchestration is BUILT + TESTED in fwgitops.push (push_folder): it lists
      # staged changes, FAILS CLOSED on anything we did not stage, pushes with
      # target=folder, polls the job, and returns an evidence-shaped result.
      # REMAINING: the thin PushClient implementation against the SCM REST API
      # (list_staged / push / job_status) — needs tenant access to verify.
      - name: SCM push (atomic boundary, folder-scoped)
        run: |
          echo "TODO(T13) wire: fwgitops.push.push_folder(client, folder, expected=...)"
          echo "  orchestration + fail-closed guard: DONE (see tests/test_push.py)"
          echo "  remaining: PushClient against the SCM REST API"
