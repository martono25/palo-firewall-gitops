# Create ONE disposable, deliberately-unmanaged object in SCM, so the
# detect -> delete -> record path can be exercised against something real.
#
# WHY THIS IS DELIBERATELY CRIPPLED. Writing config into SCM outside the
# pipeline is the exact thing this platform exists to prevent, so this is NOT a
# general object-creation workflow and must never become one. Everything that
# would make it useful for real config is fixed in this file rather than exposed
# as an input:
#
#   * ADDRESS ONLY — it cannot create a rule, so it cannot open a path;
#   * the VALUE is 192.0.2.1/32, TEST-NET-1 from RFC 5737, which is documented
#     as non-routable and reserved for examples. An address object holding it
#     cannot carry traffic even if someone later references it;
#   * the NAME is `fixture-unmanaged-<run_id>`, not free text, so a fixture is
#     always identifiable as one and two runs can never collide;
#   * the FOLDER is fixed to the pilot's GitOps folder;
#   * NO TAGS — the point is to look exactly like something a human made in the
#     console, which is what drift must catch.
#
# It is drift BY DESIGN. The nightly job will report it as `unmanaged` and file
# a violation record, and that is the workflow behaving correctly. Delete the
# fixture with delete-scm-object.yml when finished, which is usually the very
# thing being tested.
name: create-test-fixture

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE-UNMANAGED-FIXTURE to confirm you mean to write to SCM outside the pipeline"
        required: true
      scenario:
        description: "Which unauthorised change to stage"
        type: choice
        default: address
        options:
          - address          # unmanaged object
          - unmanaged-rule   # a rule nothing declares (action=deny: opens nothing)
          - malformed-copy   # a copy of a managed rule, inheriting its tags
          - edit-managed     # change a declared field on a declared rule
          - delete-managed   # DELETE a declared rule — apply must recreate it
          - reorder          # move a declared rule out of deployment order
          - all              # every scenario at once, on DIFFERENT victims

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    env:
      SCM_CLIENT_ID: ${{ secrets.SCM_CLIENT_ID }}
      SCM_CLIENT_SECRET: ${{ secrets.SCM_CLIENT_SECRET }}
      SCM_SCOPE: ${{ secrets.SCM_SCOPE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e .

      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "CREATE-UNMANAGED-FIXTURE" ]; then
            echo "::error::confirm must be exactly CREATE-UNMANAGED-FIXTURE"
            exit 1
          fi

      - name: Create the address fixture
        if: inputs.scenario == 'address' || inputs.scenario == 'all'
        env:
          RUN_ID: ${{ github.run_id }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          python - <<'PY'
          import os
          import sys

          from fwgitops.scmapi import ScmApiError, ScmCredentials, ScmSession

          FOLDER = "GitOps"
          # RFC 5737 TEST-NET-1: reserved for documentation, never routable.
          VALUE = "192.0.2.1/32"
          name = f"fixture-unmanaged-{os.environ['RUN_ID']}"

          session = ScmSession(ScmCredentials.from_env())
          try:
              # `body=`, not `json=` — ScmSession.request takes a positional
              # `body`. Written as `json=` first, which the static checks in
              # tests/test_workflow_heredocs.py do NOT catch: they verify every
              # name is bound and every env var is passed, not that a call
              # matches its signature. One more reason logic does not belong in
              # a heredoc.
              made = session.request(
                  "POST", "/config/objects/v1/addresses",
                  params={"folder": FOLDER},
                  body={"name": name, "folder": FOLDER, "ip_netmask": VALUE,
                        "description": "Disposable fixture for the delete+record "
                                       "path. Unmanaged ON PURPOSE — drift is "
                                       "expected to flag it."},
              )
          except ScmApiError as e:
              print(f"::error::create failed: {e}")
              sys.exit(1)

          print(f"created address {name!r} (id={(made or {}).get('id')}) in {FOLDER!r}")
          PY

      - name: Stage the rule scenarios
        if: inputs.scenario != 'address'
        env:
          RUN_ID: ${{ github.run_id }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          python - <<'PY'
          import os
          import sys

          from fwgitops.scmapi import ScmApiError, ScmCredentials, ScmSession

          FOLDER = "prod-edge"
          RULES = "/config/security/v1/security-rules"
          scenario = os.environ["SCENARIO"]
          run_id = os.environ["RUN_ID"]
          session = ScmSession(ScmCredentials.from_env())

          rows = (session.request("GET", RULES,
                                  params={"folder": FOLDER, "limit": 500})
                  or {}).get("data", [])
          declared = [r for r in rows
                      if isinstance(r, dict) and str(r.get("name", "")).startswith("REQ-")
                      and r.get("folder") == FOLDER]
          if not declared:
              print("::error::no managed rule found to base the scenarios on")
              sys.exit(1)
          # DIFFERENT VICTIMS PER SCENARIO, so `all` stages six independent
          # findings rather than three that cancel each other out: editing a
          # rule and then deleting the SAME rule leaves only the deletion, and
          # the edit scenario silently proves nothing.
          ordered = sorted(declared, key=lambda r: str(r["name"]))
          victim = ordered[0]                       # edited
          doomed = ordered[1] if len(ordered) > 1 else ordered[0]   # deleted
          shuffled = ordered[-1]                    # moved to the top

          def post(body, what):
              try:
                  made = session.request("POST", RULES, params={"folder": FOLDER},
                                         body=body)
              except ScmApiError as e:
                  print(f"::error::{what} failed: {e}")
                  sys.exit(1)
              print(f"STAGED {what}: {body['name']} (id={(made or {}).get('id')})")

          # ACTION=DENY THROUGHOUT. A staged rule must not be able to open a
          # path even for the minutes it exists — a deny between zones that
          # already exist changes nothing that was not already denied by the
          # default.
          base = dict(folder=FOLDER, action="deny", application=["any"],
                      category=["any"], service=["any"], source_user=["any"],
                      **{"from": victim.get("from") or ["any"],
                         "to": victim.get("to") or ["any"]},
                      source=["any"], destination=["any"])

          if scenario in ("unmanaged-rule", "all"):
              post(dict(base, name=f"console-hack-{run_id}"), "UNMANAGED rule")

          if scenario in ("malformed-copy", "all"):
              # Inherits the victim's tags — including gitops:req — under a name
              # Git declares nowhere. This is the forgery the name-based guard
              # exists for.
              post(dict(base, name=f"{victim['name']}-copy-{run_id}",
                        tag=list(victim.get("tag") or [])), "MALFORMED copy")

          if scenario in ("edit-managed", "all"):
              # `action`, NOT `description`.
              #
              # No intent declares a description, and an undeclared field is
              # deliberately not compared — so editing it would stage a change
              # the detector is designed to ignore, and the scenario would
              # "pass" by proving nothing. `action` is declared on every rule.
              #
              # allow -> DENY, which is the fail-safe direction: if remediation
              # never restores it, the rule denies traffic it used to permit.
              # The reverse would leave a widened rule live on a failure.
              body = {k: v for k, v in victim.items() if k not in ("id", "tfid")}
              body["action"] = "deny"
              try:
                  session.request("PUT", f"{RULES}/{victim['id']}", body=body)
              except ScmApiError as e:
                  print(f"::error::edit failed: {e}")
                  sys.exit(1)
              print(f"STAGED EDIT on managed rule {victim['name']}: action -> deny")

          if scenario in ("reorder", "all"):
              # `top` needs no anchor. The rule was deployed last, so moving it
              # first is unambiguously out of deployment order.
              try:
                  session.request("POST", f"{RULES}/{shuffled['id']}:move",
                                  body={"destination": "top", "rulebase": "pre"})
              except ScmApiError as e:
                  print(f"::error::move failed: {e}")
                  sys.exit(1)
              print(f"STAGED REORDER: {shuffled['name']} moved to the top")

          if scenario in ("delete-managed", "all"):
              # DELETES AN AUTHORISED RULE. The tag engine cannot see this at
              # all — it classifies rules that ARE in SCM — so `missing` is the
              # only thing that reports it, and `apply` is the only thing that
              # puts it back.
              #
              # Terraform still holds it in state, so the next apply recreates
              # it; until then the rule is absent, which DENIES the traffic it
              # used to permit — the fail-safe direction.
              try:
                  session.request("DELETE", f"{RULES}/{doomed['id']}")
              except ScmApiError as e:
                  print(f"::error::delete failed: {e}")
                  sys.exit(1)
              print(f"STAGED DELETE of managed rule {doomed['name']} "
                    f"(id={doomed['id']}) — apply must recreate it")

          print("::notice::Now run drift-detect.yml, then remediate.yml")
          PY
