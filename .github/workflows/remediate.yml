# ─────────────────────────────────────────────────────────────────────────
# AUTOMATIC REMEDIATION — deletes config nobody authorised.
#
# This is the only scheduled job here that DESTROYS things. Everything else
# reports. Read `docs/cli-reference.md#remediate` before changing it.
#
# THE POLICY (2026-08-16): GitOps is the source of truth, so config no request
# authorised does not survive to the next day. One rule decides what goes —
# does Git DECLARE it? — and it applies to every drift class:
#
#   unmanaged                          -> delete, nothing declares it
#   orphaned                           -> delete, its request is gone from Git
#   malformed, name not declared       -> delete, a console copy
#   malformed, name IS declared        -> LEFT ALONE; `apply` repairs its tags
#
# EMERGENCY CHANGES HAVE A WINDOW. A hand-made fix survives until this job runs
# and no longer. That is a timing constraint the operator must know about, not a
# reason to keep deletion manual — it is in the runbook beside the emergency
# procedure. Note that raising the AccessRequest creates a NEW rule under its
# request id; the hand-made one is still unmanaged and is still deleted, which
# is the intended end state.
#
# RUNS AFTER DRIFT, not with it. Drift is read-only by design and stays that
# way. Remediation re-detects rather than reading drift's records: acting on a
# record written an hour earlier would delete on a stale observation.
# ─────────────────────────────────────────────────────────────────────────
name: remediate

on:
  schedule:
    # 13:15 UTC == 21:15 SGT, one hour after drift-detect. The hour is the gap
    # in which a detected finding can still be fixed by hand before anything is
    # destroyed.
    - cron: "15 13 * * *" # daily 21:15 SGT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what WOULD be deleted, delete nothing"
        type: boolean
        default: true

permissions:
  # `write` to land the record of what was removed. Nothing is pushed to main
  # directly.
  contents: write
  pull-requests: write
  # `actions: read` so the guard can query previous apply runs, and REQUIRED BY
  # THE WORKFLOW THIS CALLS as well.
  actions: read
  # REQUIRED BY THE WORKFLOW THIS CALLS, not by anything here.
  #
  # A called workflow cannot be granted more than its caller holds, and
  # `apply.yml` needs `id-token: write` for the OIDC exchange to the Terraform
  # state backend. Without it the whole run is rejected at STARTUP — no jobs, no
  # log, and an error that says nothing about permissions. Two dispatches were
  # spent looking elsewhere.
  id-token: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    env:
      SCM_CLIENT_ID: ${{ secrets.SCM_CLIENT_ID }}
      SCM_CLIENT_SECRET: ${{ secrets.SCM_CLIENT_SECRET }}
      SCM_SCOPE: ${{ secrets.SCM_SCOPE }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e .

      - name: Remove what nobody authorised
        run: |
          set -euo pipefail
          # DRY RUN UNLESS THE SCHEDULE SAYS OTHERWISE. A manual dispatch
          # defaults to reporting, so someone checking the blast radius cannot
          # destroy anything by leaving the box alone.
          flag="--apply"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.dry_run }}" != "false" ]; then
            flag=""
            echo "::notice::DRY RUN — nothing will be deleted"
          fi
          removed=0
          for dir in terraform/*/; do
            folder=$(basename "$dir")
            case "$folder" in bootstrap-* | github-oidc | modules) continue ;; esac
            [ -f "$dir/main.tf" ] || continue
            echo "::group::remediate $folder"
            rc=0
            fwgitops remediate "$folder" $flag || rc=$?
            echo "::endgroup::"
            case "$rc" in
              0) ;;
              3) echo "::warning::removed unauthorised config in '$folder'"; removed=1 ;;
              *) echo "::error::remediation failed for '$folder' (rc=$rc)"; exit 1 ;;
            esac
          done
          echo "REMOVED=$removed" >> "$GITHUB_ENV"

      # THE RECORD OF A DELETION OUTLIVES THE RUN. `if: always()` because a
      # failure partway through has usually already removed something, and that
      # is exactly the record worth keeping.
      - name: Land the removal records
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git add -A evidence/manual-actions 2>/dev/null || true
          if git diff --cached --quiet -- evidence/manual-actions; then
            echo "nothing removed — no record to land"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="remediation/run-${GITHUB_RUN_ID}"
          git checkout -B "$branch" origin/main
          git add -A evidence/manual-actions
          git commit -m "record: removed unauthorised config (run ${GITHUB_RUN_ID})"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "record: removed unauthorised config (run ${GITHUB_RUN_ID})" \
            --body "Automatic remediation deleted configuration that no request authorised. Each file under \`evidence/manual-actions/\` names what was removed, why, and the violation it remediates. THIS PR IS THE RECORD, not the decision — the deletion has already happened. See \`docs/adr/0011-unmanaged-drift-is-deleted.md\`." \
            || gh pr view "$branch" --json url >/dev/null
          gh pr merge "$branch" --squash --auto --delete-branch || true

  # NOTE THE UNDERSCORE. A job id with a HYPHEN cannot be read in an expression
  # with dot notation: GitHub parses `needs.already-applied.outputs.ok` as a
  # SUBTRACTION, rejects the whole file, and the run fails at startup with no
  # jobs and no message worth reading. `needs['already-applied']` would work;
  # an underscore avoids the trap entirely.
  #
  # IS THERE ANY NEW POLICY WAITING FOR A HUMAN?
  #
  # The restore below applies `main` with the approval gate OFF. That is correct
  # for putting back config somebody changed by hand, and it would be a BYPASS
  # for anything else: merge a CRITICAL intent, leave `firewall-apply`
  # unapproved, and the nightly restore would apply it for you.
  #
  # THE QUESTION IS NOT "WAS THIS COMMIT APPLIED?". That was the first version
  # and it was wrong within the hour: `apply.yml` triggers only on `intent/`,
  # `catalog/`, `terraform/` and `src/fwgitops/`, so merging docs, tests or a
  # workflow advances main WITHOUT an apply. The guard would then refuse for the
  # rest of time, and the restore would silently never run — the failure this
  # repository keeps finding.
  #
  # The real question is whether DECLARED STATE has changed since the last
  # successful apply. If it has not, the running config is already what main
  # declares and re-applying can only put back drift. If it has, something is
  # waiting at the gate and this must not pre-empt it.
  already_applied:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to diff against the last applied commit. At depth 1 there is
          # no history and the diff cannot be computed.
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=apply.yml \
                   --limit 50 --json headSha,conclusion \
                   --jq '[.[] | select(.conclusion=="success")][0].headSha' || true)
          if [ -z "$last" ] || [ "$last" = "null" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No successful apply on record. Refusing to restore."
            exit 0
          fi
          if ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$last" || true
          fi
          changed=$(git diff --name-only "$last"..HEAD -- \
                      intent catalog terraform src/fwgitops || echo UNKNOWN)
          if [ -z "$changed" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "declared state unchanged since ${last:0:8} — a restore can only put back drift"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Declared state changed since the last successful apply \
          and may be waiting at the approval gate. Refusing to restore, so this \
          cannot deploy it unattended. Files: $changed"
          fi

  # RESTORE WHAT WAS EDITED, DELETED OR REORDERED — unattended.
  #
  # Deletion above handles config Git does not declare. This handles the other
  # half: a managed rule someone EDITED in the console, one they DELETED, and a
  # rulebase they REORDERED. The remedy for all three is to re-assert the
  # declared state, which is what `apply` does.
  restore:
    # THE SAME CONCURRENCY GROUP `apply.yml` DECLARES, repeated here because it
    # does not carry across the call.
    #
    # A workflow's top-level `concurrency` applies to runs OF that workflow. When
    # it is invoked as a reusable workflow the caller's run owns the group, so
    # apply.yml's `fw-apply-<ref>` was simply not in force — and the unattended
    # restore ran outside the very guard that exists to stop two applies
    # colliding on Terraform state. It failed on exactly that, first time out:
    #
    #   PutObject -> 412 PreconditionFailed  (the lock exists)
    #   GetObject -> 404 NoSuchKey           (the lock is gone)
    #
    # Two processes contending, one releasing between the calls. `REQ-2026-0725`
    # stayed `deny` because the restore never completed.
    #
    # `cancel-in-progress: false` for the same reason apply.yml gives: an
    # in-flight apply is never killed, it is queued behind.
    concurrency:
      group: fw-apply-${{ github.ref }}
      cancel-in-progress: false
    needs: [remediate, already_applied]
    if: github.event_name == 'schedule' && needs.already_applied.outputs.ok == 'true'
    uses: ./.github/workflows/apply.yml
    with:
      unattended: true
    secrets: inherit
