# ─────────────────────────────────────────────────────────────────────────
# Scheduled DRIFT DETECTION (Phase 2, detect-and-alert).
#
# GitOps trusts Git, not the running config. This runs `terraform plan` on each
# managed folder on a schedule: a non-empty plan means SCM's managed config has
# drifted from the declared desired state (a rule edited/deleted out of band).
# The job FAILS on drift — that failure is the alert (GitHub notifies). Reconcile
# is the human-approved apply.yml, never an automatic write here (read-only).
#
# Scope note: `terraform plan` catches drift in resources IN its state (managed
# rules modified/deleted). UNMANAGED additions (a rule added directly in SCM,
# which terraform can't see) are covered by the tag-based `fwgitops drift`
# --snapshot engine — wire it here once the SCM rules-list read lands.
# ─────────────────────────────────────────────────────────────────────────
name: drift-detect

on:
  schedule:
    - cron: "0 2 * * *"   # daily 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # OIDC to cloud for the TF state backend

jobs:
  drift:
    runs-on: ubuntu-latest
    # THE SCHEDULE ONLY RUNS WHILE THE FIREWALL IS UP.
    #
    # The pilot is suspended in AWS between test sessions to stop the EC2 draw
    # (m5.xlarge — sized for ENIs, not CPU; see
    # provisioning/aws-vmseries-pilot/variables.tf). With it stopped, every
    # nightly run fails on `device-sync` and the SCM reads — and a red run every
    # morning for a known-absent firewall is exactly how a real alert gets
    # ignored. This job's FAILURE IS THE ALERT, so protecting that signal matters
    # more than having it run on a schedule nobody can act on.
    #
    # A manual dispatch ALWAYS runs: you only dispatch when you mean to, and
    # needing to flip a variable first would put friction in front of the check
    # at the exact moment someone wants it.
    #
    # Set repo variable FIREWALL_ONLINE=true when the pilot is up for testing;
    # unset or false while it is stopped. A skipped job is visibly skipped in the
    # runs list — not silently green, which would be the worse failure here.
    if: github.event_name == 'workflow_dispatch' || vars.FIREWALL_ONLINE == 'true'
    # SCM auth for the scm provider's refresh during plan.
    env:
      SCM_CLIENT_ID: ${{ secrets.SCM_CLIENT_ID }}
      SCM_CLIENT_SECRET: ${{ secrets.SCM_CLIENT_SECRET }}
      SCM_SCOPE: ${{ secrets.SCM_SCOPE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e .

      - uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-southeast-1

      # IS THE FIREWALL RUNNING WHAT SCM HOLDS? Drift (below) compares Git
      # against SCM. Nothing compared SCM against the DEVICE, so a change could
      # be applied in SCM and never reach the firewall — Git and SCM agreeing
      # while the device runs something else. Silent, persistent, and the next
      # successful push by anyone applies it, including someone pushing an
      # unrelated change.
      #
      # Observed 2026-08-06: a logical router destroyed in SCM, the push refused,
      # and the device still forwarding on the deleted route. Nothing reported it.
      - name: Device config sync (SCM vs firewall)
        run: fwgitops device-sync

      # THE CATALOG IS A HAND-MAINTAINED MIRROR of a hierarchy that changes
      # underneath it, and nothing verified the two until now. It has gone wrong
      # twice: device serials listed as child FOLDERS (v1.11.0), and a firewall
      # that left SCM entirely while the catalog kept listing it as targetable
      # (2026-08-05). Both produce the same failure — an intent that compiles
      # clean and dies at apply, past every compile-time check.
      #
      # Read-only. Objects in SCM the catalog does not mention are NOT reported:
      # Prisma Access built-ins are deliberately absent, and a check that cries
      # wolf every run gets ignored.
      - name: Verify the catalog against SCM
        run: fwgitops verify-catalog

      # Read-only: plan with -detailed-exitcode (2 = drift) per managed folder.
      - name: Detect drift (terraform plan per folder)
        run: |
          set -euo pipefail
          drift=0
          for dir in terraform/*/; do
            folder=$(basename "$dir")
            # Skip run-once bootstraps (local state) and the shared module dir.
            case "$folder" in bootstrap-* | github-oidc | modules) continue ;; esac
            [ -f "$dir/main.tf" ] || continue
            [ -f "$dir/rules.auto.tfvars.json" ] || continue
            echo "::group::plan $folder"
            ./terraform/make-backend.sh "$folder"
            terraform -chdir="$dir" init -input=false -backend-config=backend.hcl
            set +e
            # -parallelism=1 REQUIRED, same reason as apply.yml: the scm provider
            # cannot handle concurrent token acquisition. A plan REFRESHES every
            # resource, so a folder with ~19 tag objects plus rules, zones and
            # routers issues exactly the concurrent burst that breaks it —
            # intermittent `403 Forbidden {"msg":"Access denied"}` on a tag read,
            # which looks like a permissions problem and is not. Observed in CI
            # 2026-08-05; the guard existed on apply from the start and was never
            # carried to plan.
            terraform -chdir="$dir" plan -input=false -no-color -detailed-exitcode -parallelism=1
            rc=$?
            set -e
            echo "::endgroup::"
            if [ "$rc" = "2" ]; then
              echo "::warning::DRIFT in '$folder' — SCM has diverged from the declared desired state"
              drift=1
            elif [ "$rc" != "0" ]; then
              echo "::error::plan failed for '$folder' (rc=$rc)"; exit 1
            fi
          done
          if [ "$drift" = "1" ]; then
            echo "::error::Drift detected — a managed folder's SCM config no longer matches Git. Reconcile via the (human-approved) apply workflow."
            exit 1
          fi
          echo "No drift — SCM matches the declared policy."

      # State-based drift for objects that CANNOT carry gitops: tags. scm_zone
      # has no `tag` attribute (only 14 of the provider's resources do), so the
      # tag-based engine cannot see zones at all — and `terraform plan` above
      # cannot see ADDITIONS, only changes to resources already in its state. A
      # zone added by hand is therefore invisible to everything except this step.
      #
      # Read-only. The snapshot records the QUERIED folder as `scope`: SCM
      # returns the folder an object is DEFINED in, and without that distinction
      # every inherited object reads as unexpected (7 false positives against the
      # live tenant, where all zones are defined in the shared parent).
      # THE CHECK THAT CATCHES A RULE ADDED DIRECTLY IN SCM. terraform cannot
      # see those — they are not in its state — so the plan above reports "No
      # drift" no matter how many appear. Only the tag-based engine can tell
      # ours from somebody else's, by reading gitops: provenance.
      #
      # It was implemented, registered and tested, and NOTHING CALLED IT. The
      # step below iterates `kinds --state-drift`, which is the other three
      # kinds; rules declare drift_engine="tag" and were in no loop anywhere.
      # Four rules added straight into prod-edge sat unflagged (2026-08-15).
      - name: Detect rule drift (added or removed directly in SCM)
        run: |
          set -euo pipefail
          drift=0
          for dir in terraform/*/; do
            folder=$(basename "$dir")
            case "$folder" in bootstrap-* | github-oidc | modules) continue ;; esac
            [ -f "$dir/main.tf" ] || continue
            echo "::group::rule drift $folder"
            out="rules-$folder.json"
            fwgitops snapshot AccessRequest --scope-dir "$folder" --out "$out"
            rc=0
            fwgitops drift --snapshot "$out" || rc=$?
            echo "::endgroup::"
            case "$rc" in
              0) ;;
              # 3 is the drift signal, not a failure of the check. A warning
              # keeps the job red-for-broken and yellow-for-drifted, which are
              # different things to act on.
              3) echo "::warning::RULE DRIFT in '$folder' — see the group above"; drift=1 ;;
              *) echo "::error::rule drift check failed for '$folder' (rc=$rc)"; exit 1 ;;
            esac
          done
          [ "$drift" -eq 0 ] || echo "::warning::rule drift detected — see groups above"

      - name: Detect state drift (kinds that cannot carry tags)
        run: |
          set -euo pipefail
          drift=0
          for dir in terraform/*/; do
            folder=$(basename "$dir")
            case "$folder" in bootstrap-* | github-oidc | modules) continue ;; esac
            [ -f "$dir/main.tf" ] || continue
            echo "::group::state drift $folder"
            # One snapshot per kind that cannot carry gitops: tags. Driven off
            # the registry, so a new kind is covered as soon as it registers
            # drift_engine="state" — no edit needed here.
            snaps=()
            for kind in $(fwgitops kinds --state-drift); do
              out="state-$kind-$folder.json"
              # --scope-dir, not a positional folder: for the device root the
              # directory is `device-<serial>`, which SCM rejects as a folder
              # ("Folder device-... doesn't exist"). fwgitops owns that mapping
              # via Scope.from_dirname; duplicating the `device-` prefix here is
              # what broke this job on 2026-08-08.
              fwgitops snapshot "$kind" --scope-dir "$folder" --out "$out"
              snaps+=(--state-snapshot "$out")
            done
            rc=0
            if [ ${#snaps[@]} -gt 0 ]; then
              fwgitops drift "${snaps[@]}" || rc=$?
            fi
            echo "::endgroup::"
            case "$rc" in
              0) ;;
              3) echo "::warning::ZONE DRIFT in '$folder'"; drift=1 ;;
              *) echo "::error::zone drift check failed for '$folder' (rc=$rc)"; exit 1 ;;
            esac
          done
          if [ "$drift" = "1" ]; then
            echo "::error::State drift detected — an object exists in SCM that Git never declared, or a declared one has been changed or removed out of band."
            exit 1
          fi
          echo "No state drift."
