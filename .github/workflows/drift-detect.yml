# ─────────────────────────────────────────────────────────────────────────
# Scheduled DRIFT DETECTION (Phase 2, detect-and-alert).
#
# GitOps trusts Git, not the running config. This runs `terraform plan` on each
# managed folder on a schedule: a non-empty plan means SCM's managed config has
# drifted from the declared desired state (a rule edited/deleted out of band).
# The job FAILS on drift — that failure is the alert (GitHub notifies). Reconcile
# is the human-approved apply.yml, never an automatic write here (read-only).
#
# Scope note: `terraform plan` catches drift in resources IN its state (managed
# rules modified/deleted). UNMANAGED additions (a rule added directly in SCM,
# which terraform can't see) are covered by the tag-based `fwgitops drift`
# --snapshot engine — wire it here once the SCM rules-list read lands.
# ─────────────────────────────────────────────────────────────────────────
name: drift-detect

on:
  schedule:
    - cron: "0 2 * * *"   # daily 02:00 UTC
  workflow_dispatch: {}

permissions:
  # `write` because a detected violation is RECORDED, not just logged — the
  # records land on a branch and open a pull request. Nothing is pushed to
  # `main` directly, and nothing here writes to SCM: the reads stay read-only.
  contents: write
  pull-requests: write
  id-token: write # OIDC to cloud for the TF state backend

jobs:
  drift:
    runs-on: ubuntu-latest
    # THE SCHEDULE ONLY RUNS WHILE THE FIREWALL IS UP.
    #
    # NO FIREWALL_ONLINE GATE — removed 2026-08-15, because its premise was
    # false. It read:
    #
    #   "With it stopped, every nightly run fails on device-sync and the SCM
    #    reads ... this job's FAILURE IS THE ALERT, so protecting that signal
    #    matters more than having it run on a schedule nobody can act on."
    #
    # Sound reasoning from a wrong fact. NOTHING here touches the firewall.
    # `device-sync` is SCM-only — it reads
    # /config/operations/v1/config-versions/{running,candidate}, has no ssh path
    # at all, and answers "what does SCM believe the device is running". Verified
    # 2026-08-15 with the pilot STOPPED: the whole job ran green, device-sync
    # included.
    #
    # The cost of the gate was five consecutive skipped nights (2026-08-11
    # onward) during which a rule added straight into SCM would have gone
    # unreported — while the repo's claim is that GitOps is the source of truth
    # and direct changes are flagged.
    #
    # KNOWN LIMIT OF device-sync, which the gate obscured: because it reads SCM's
    # view rather than the device, a POWERED-OFF firewall still reports as
    # running the newest config. It answers "did the push land in SCM's record",
    # not "is that box alive".
    # SCM auth for the scm provider's refresh during plan.
    env:
      SCM_CLIENT_ID: ${{ secrets.SCM_CLIENT_ID }}
      SCM_CLIENT_SECRET: ${{ secrets.SCM_CLIENT_SECRET }}
      SCM_SCOPE: ${{ secrets.SCM_SCOPE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e .

      - uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-southeast-1

      # IS THE FIREWALL RUNNING WHAT SCM HOLDS? Drift (below) compares Git
      # against SCM. Nothing compared SCM against the DEVICE, so a change could
      # be applied in SCM and never reach the firewall — Git and SCM agreeing
      # while the device runs something else. Silent, persistent, and the next
      # successful push by anyone applies it, including someone pushing an
      # unrelated change.
      #
      # Observed 2026-08-06: a logical router destroyed in SCM, the push refused,
      # and the device still forwarding on the deleted route. Nothing reported it.
      - name: Device config sync (SCM vs firewall)
        run: fwgitops device-sync

      # THE CATALOG IS A HAND-MAINTAINED MIRROR of a hierarchy that changes
      # underneath it, and nothing verified the two until now. It has gone wrong
      # twice: device serials listed as child FOLDERS (v1.11.0), and a firewall
      # that left SCM entirely while the catalog kept listing it as targetable
      # (2026-08-05). Both produce the same failure — an intent that compiles
      # clean and dies at apply, past every compile-time check.
      #
      # Read-only. Objects in SCM the catalog does not mention are NOT reported:
      # Prisma Access built-ins are deliberately absent, and a check that cries
      # wolf every run gets ignored.
      - name: Verify the catalog against SCM
        run: fwgitops verify-catalog

      # COMPILE FIRST. The tfvars are generated artifacts, absent from a fresh
      # checkout — and without them the plan step below skipped every folder and
      # printed "No drift" having compared nothing. See its guard.
      # BOTH producers, in apply.yml's order. Compiling alone is not enough:
      # `$eth-*` folder interface variables come from `folder-interfaces`, and
      # without them Terraform sees a resource in STATE with no config and plans
      # to DESTROY IT. The first run after adding compile-only proposed
      #
      #   scm_ethernet_interface.this["$eth-dmz"] will be destroyed
      #
      # for a live interface. A drift report that tells an operator to delete a
      # firewall's interface is worse than the silent one it replaced — and
      # "reconcile via the apply workflow" would have carried it out.
      - name: Materialise folder interface variables
        run: fwgitops folder-interfaces

      - name: Compile intents (the plan needs something to compare against)
        run: fwgitops compile intent

      # Read-only: plan with -detailed-exitcode (2 = drift) per managed folder.
      - name: Detect drift (terraform plan per folder)
        run: |
          set -euo pipefail
          drift=0
          for dir in terraform/*/; do
            folder=$(basename "$dir")
            # Skip run-once bootstraps (local state) and the shared module dir.
            case "$folder" in bootstrap-* | github-oidc | modules) continue ;; esac
            [ -f "$dir/main.tf" ] || continue
            # ANY compiled tfvars, not just RULES — the identical guard apply.yml
            # carried until v1.39.2, where a scope holding only interfaces, zones
            # or routes was skipped ENTIRELY while the job reported success. The
            # fix was never carried here, and here it was worse: nothing compiled
            # at all, so EVERY folder was skipped and this step reported "No
            # drift" on every run since it was written. The check that catches a
            # managed object edited in SCM had never once run.
            shopt -s nullglob
            set -- "$dir"*.auto.tfvars.json
            shopt -u nullglob
            [ "$#" -gt 0 ] || { echo "nothing compiled for $folder — skip"; continue; }
            echo "::group::plan $folder"
            ./terraform/make-backend.sh "$folder"
            terraform -chdir="$dir" init -input=false -backend-config=backend.hcl
            set +e
            # -parallelism=1 REQUIRED, same reason as apply.yml: the scm provider
            # cannot handle concurrent token acquisition. A plan REFRESHES every
            # resource, so a folder with ~19 tag objects plus rules, zones and
            # routers issues exactly the concurrent burst that breaks it —
            # intermittent `403 Forbidden {"msg":"Access denied"}` on a tag read,
            # which looks like a permissions problem and is not. Observed in CI
            # 2026-08-05; the guard existed on apply from the start and was never
            # carried to plan.
            terraform -chdir="$dir" plan -input=false -no-color -detailed-exitcode -parallelism=1
            rc=$?
            set -e
            echo "::endgroup::"
            if [ "$rc" = "2" ]; then
              echo "::warning::DRIFT in '$folder' — SCM has diverged from the declared desired state"
              drift=1
            elif [ "$rc" != "0" ]; then
              echo "::error::plan failed for '$folder' (rc=$rc)"; exit 1
            fi
          done
          # A FINDING IS NOT A REASON TO STOP LOOKING. This step records its
          # verdict and exits 0; the gate at the end of the job turns the
          # collected verdicts into the single failure that alerts. Exiting 1
          # here skipped every check BELOW it — proven on runs 31926302117 and
          # 31924264360, where rule drift failed and state drift shows
          # `skipped`. A genuine ERROR still exits 1 immediately (above): a
          # broken check and a detected violation are different things.
          if [ "$drift" = "1" ]; then
            echo "Drift detected — a managed folder's SCM config no longer matches Git. Reconcile via the (human-approved) apply workflow." \
              >> "$RUNNER_TEMP/drift-verdicts"
          else
            echo "No plan drift — managed config in SCM matches the declared policy."
          fi

      # State-based drift for objects that CANNOT carry gitops: tags. scm_zone
      # has no `tag` attribute (only 14 of the provider's resources do), so the
      # tag-based engine cannot see zones at all — and `terraform plan` above
      # cannot see ADDITIONS, only changes to resources already in its state. A
      # zone added by hand is therefore invisible to everything except this step.
      #
      # Read-only. The snapshot records the QUERIED folder as `scope`: SCM
      # returns the folder an object is DEFINED in, and without that distinction
      # every inherited object reads as unexpected (7 false positives against the
      # live tenant, where all zones are defined in the shared parent).
      # THE CHECK THAT CATCHES A RULE ADDED DIRECTLY IN SCM. terraform cannot
      # see those — they are not in its state — so the plan above reports "No
      # drift" no matter how many appear. Only the tag-based engine can tell
      # ours from somebody else's, by reading gitops: provenance.
      #
      # It was implemented, registered and tested, and NOTHING CALLED IT. The
      # step below iterates `kinds --state-drift`, which is the other three
      # kinds; rules declare drift_engine="tag" and were in no loop anywhere.
      # Four rules added straight into prod-edge sat unflagged (2026-08-15).
      - name: Detect rule drift (added or removed directly in SCM)
        run: |
          set -euo pipefail
          drift=0
          for dir in terraform/*/; do
            folder=$(basename "$dir")
            case "$folder" in bootstrap-* | github-oidc | modules) continue ;; esac
            [ -f "$dir/main.tf" ] || continue
            echo "::group::rule drift $folder"
            out="rules-$folder.json"
            fwgitops snapshot AccessRequest --scope-dir "$folder" --out "$out"
            rc=0
            # --scope-checked names the folder we READ even if it returned
            # nothing, so an empty folder can still close its old findings while
            # a folder nobody read cannot.
            fwgitops drift --snapshot "$out" \
              --record-violations evidence/violations \
              --scope-checked "$folder" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              || rc=$?
            echo "::endgroup::"
            case "$rc" in
              0) ;;
              # 3 is the drift signal, not a failure of the check. A warning
              # keeps the job red-for-broken and yellow-for-drifted, which are
              # different things to act on.
              3) echo "::warning::RULE DRIFT in '$folder' — see the group above"; drift=1 ;;
              *) echo "::error::rule drift check failed for '$folder' (rc=$rc)"; exit 1 ;;
            esac
          done
          # THE JOB STILL FAILS ON THIS — at the gate, not here.
          #
          # Added 2026-08-15 warning-only, which made it the odd one out: a rule
          # added straight into SCM produced a YELLOW ANNOTATION ON A GREEN RUN,
          # in a job whose whole premise is that its FAILURE is the alert.
          # Nobody is notified about a green run. Making it `exit 1` fixed that
          # and created the defect this note replaces: it began skipping the
          # state-drift check behind it, so a night with MORE drift reported
          # LESS of it. Both properties are wanted, and they are separable —
          # record here, fail at the gate.
          if [ "$drift" = "1" ]; then
            echo "Rule drift detected — a security rule exists in SCM that Git never declared, or a declared one was removed out of band. Terraform will NOT reconcile it: an unmanaged rule is not in its state, so it persists until someone adopts it into Git or deletes it in SCM." \
              >> "$RUNNER_TEMP/drift-verdicts"
          fi

      # A VIOLATION OUTLIVES THE RUN THAT FOUND IT.
      #
      # `if: always()` no longer exists for the reason it was added. It was
      # written when the step above EXITED 1 on a finding, which would have run
      # this only on the nights that found NOTHING — wired, and writing a record
      # exactly never. Findings now go to the gate, so the normal path reaches
      # here anyway.
      #
      # It stays for the ERROR path: a check that fails partway has usually
      # already written records for the folders it got through, and those are
      # worth landing. The step is a no-op when nothing changed, so running it
      # after an unrelated failure costs nothing.
      - name: Land any violation records by pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git add -A evidence/violations 2>/dev/null || true
          if git diff --cached --quiet -- evidence/violations; then
            echo "no violation records changed — nothing to land"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="violations/run-${GITHUB_RUN_ID}"
          git checkout -B "$branch"
          git commit -m "record: policy violations seen in run ${GITHUB_RUN_ID}"
          git push -f origin "$branch"
          # Never auto-merged. A violation is an UNAUTHORISED CHANGE, and the
          # pull request is where a human acknowledges it — merging it for them
          # would file the finding and close the loop with nobody in it.
          gh pr create --base main --head "$branch" \
            --title "record: policy violations (run ${GITHUB_RUN_ID})" \
            --body "Drift detection found configuration in SCM that no request authorised. Each file under \`evidence/violations/\` is one finding, keyed on the object — reappearing nightly updates \`last_seen\` rather than filing a duplicate. Review, act, and merge to accept the record. See \`docs/adr/0011-unmanaged-drift-is-deleted.md\`." \
            || gh pr view "$branch" --json url >/dev/null

      - name: Detect state drift (kinds that cannot carry tags)
        run: |
          set -euo pipefail
          drift=0
          for dir in terraform/*/; do
            folder=$(basename "$dir")
            case "$folder" in bootstrap-* | github-oidc | modules) continue ;; esac
            [ -f "$dir/main.tf" ] || continue
            echo "::group::state drift $folder"
            # One snapshot per kind that cannot carry gitops: tags. Driven off
            # the registry, so a new kind is covered as soon as it registers
            # drift_engine="state" — no edit needed here.
            snaps=()
            for kind in $(fwgitops kinds --state-drift); do
              out="state-$kind-$folder.json"
              # --scope-dir, not a positional folder: for the device root the
              # directory is `device-<serial>`, which SCM rejects as a folder
              # ("Folder device-... doesn't exist"). fwgitops owns that mapping
              # via Scope.from_dirname; duplicating the `device-` prefix here is
              # what broke this job on 2026-08-08.
              fwgitops snapshot "$kind" --scope-dir "$folder" --out "$out"
              snaps+=(--state-snapshot "$out")
            done
            rc=0
            if [ ${#snaps[@]} -gt 0 ]; then
              fwgitops drift "${snaps[@]}" || rc=$?
            fi
            echo "::endgroup::"
            case "$rc" in
              0) ;;
              3) echo "::warning::ZONE DRIFT in '$folder'"; drift=1 ;;
              *) echo "::error::zone drift check failed for '$folder' (rc=$rc)"; exit 1 ;;
            esac
          done
          if [ "$drift" = "1" ]; then
            echo "State drift detected — an object exists in SCM that Git never declared, or a declared one has been changed or removed out of band." \
              >> "$RUNNER_TEMP/drift-verdicts"
          else
            echo "No state drift."
          fi

      # ONE NIGHT, ONE ALERT, EVERY FINDING IN IT.
      #
      # The three checks above each USED to `exit 1` the moment they found
      # something, which skipped every check below — so the first thing to fire
      # was the only thing reported. On a night when a managed rule was edited
      # AND an unmanaged zone appeared, you heard about the rule; the zone
      # surfaced the following night and read as a new event rather than
      # something that had been there all along. A detector whose premise is
      # "the failure is the alert" was systematically least complete on the
      # nights with the most to say. Confirmed on runs 31926302117 and
      # 31924264360: `Detect state drift` = SKIPPED.
      #
      # It also silently disarmed the violation RECORDS: those are written by
      # the rule-drift step, so any earlier failure meant a night produced no
      # records at all.
      #
      # No `if:` — a detection step that ERRORS (rather than finds) still fails
      # the job on its own and correctly skips this gate. A broken check must
      # not be reported as "no drift".
      - name: Alert on everything this run found
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/drift-verdicts"
          if [ ! -s "$f" ]; then
            echo "No drift of any kind — SCM matches the declared policy."
            exit 0
          fi
          echo "::error::DRIFT DETECTED — $(wc -l < "$f" | tr -d ' ') finding(s) this run:"
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            echo "::error::  [$n] $line"
          done < "$f"
          echo "Violation records (where the finding outlives this log): evidence/violations/"
          exit 1
