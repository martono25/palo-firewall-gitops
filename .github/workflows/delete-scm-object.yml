# Delete an object in SCM that GITOPS DOES NOT OWN. Manual dispatch only.
#
# WHY THIS EXISTS. The runbook's treatment for an unmanaged object is "remove it
# in SCM — there is no pipeline path, because the pipeline only deletes what it
# created". True, and it made the documented remedy a console click with no
# record. Drift can now find these (the tag engine); this is how you act on one
# without leaving the platform.
#
# WHAT IT REFUSES, and why each guard is here rather than in a comment:
#
#   * a name that does not match `confirm` — typed twice, the cheapest guard
#     against deleting the wrong object;
#   * anything carrying `gitops:req` — that object belongs to an intent, and the
#     way to remove it is to delete the intent (`removing-things.md`), which
#     produces evidence and an approval. Deleting it here would strip a live
#     rule with no record and leave Terraform's state pointing at nothing;
#   * anything named in intent/ — same reason, caught by text before the API.
#
# It does NOT delete tags. `gitops:managed` is shared by every managed object in
# a folder, and the one place still declaring it (spike/smoke) is being fixed
# separately.
name: delete-scm-object

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "What to delete"
        required: true
        type: choice
        options: [security-rule, address, service]
      folder:
        description: "SCM folder holding it"
        required: true
      name:
        description: "Exact object name"
        required: true
      confirm:
        description: "Type the SAME name again to confirm"
        required: true
      reason:
        description: "Why it is being removed — lands in the record"
        required: true
      violation_id:
        description: "The VIOL-... id this remediates (see evidence/violations/), or NONE if nothing detected it"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      SCM_CLIENT_ID: ${{ secrets.SCM_CLIENT_ID }}
      SCM_CLIENT_SECRET: ${{ secrets.SCM_CLIENT_SECRET }}
      SCM_SCOPE: ${{ secrets.SCM_SCOPE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e .

      - name: Guards
        env:
          NAME: ${{ inputs.name }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$NAME" = "$CONFIRM" ] || { echo "::error::name and confirm differ — refusing"; exit 1; }
          if grep -rq "$NAME" intent/ 2>/dev/null; then
            echo "::error::'$NAME' appears in intent/ — this repo declares it. Remove the intent instead (docs/removing-things.md), which produces evidence and an approval."
            exit 1
          fi
          echo "guards passed for '$NAME'"

      - name: Delete
        env:
          KIND: ${{ inputs.kind }}
          FOLDER: ${{ inputs.folder }}
          NAME: ${{ inputs.name }}
          VIOLATION_ID: ${{ inputs.violation_id }}
          # THE RECORD'S CONTENTS. Absent until 2026-08-16, so `reason` — a
          # REQUIRED input, described as "lands in the record" — reached the
          # record as an empty string, along with who ran it and where.
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          from fwgitops.scmapi import ScmApiError, ScmCredentials, ScmSession

          PATHS = {
              "security-rule": "/config/security/v1/security-rules",
              "address": "/config/objects/v1/addresses",
              "service": "/config/objects/v1/services",
          }
          kind, folder, name = os.environ["KIND"], os.environ["FOLDER"], os.environ["NAME"]
          path = PATHS[kind]
          session = ScmSession(ScmCredentials.from_env())

          rows = (session.request("GET", path, params={"folder": folder, "limit": 500})
                  or {}).get("data", [])
          hits = [r for r in rows if isinstance(r, dict) and r.get("name") == name]
          if not hits:
              print(f"::error::no {kind} named {name!r} in folder {folder!r}")
              sys.exit(1)
          obj = hits[0]

          # DEFINED HERE, NOT INHERITED. A folder read returns ancestors' objects
          # too, and deleting one of those from a child scope is somebody else's
          # config.
          if obj.get("folder") not in (None, folder):
              print(f"::error::{name!r} is defined in {obj['folder']!r}, not {folder!r} — "
                    f"it is inherited here. Delete it where it is defined.")
              sys.exit(1)

          tags = obj.get("tag") or obj.get("tags") or []
          owned = [t for t in tags if isinstance(t, str) and t.startswith("gitops:req")]
          if owned:
              print(f"::error::{name!r} carries {owned} — an intent owns it. Remove the "
                    f"intent instead (docs/removing-things.md), which leaves evidence.")
              sys.exit(1)

          print(f"deleting {kind} {name!r} (id={obj.get('id')}) tags={tags or 'none'}")
          try:
              session.request("DELETE", f"{path}/{obj['id']}")
          except ScmApiError as e:
              print(f"::error::DELETE failed: {e}")
              sys.exit(3)
          print(f"OK — deleted {kind} {name!r} from {folder!r}")

          # THE RECORD, built by `fwgitops.evidence` rather than inline here.
          # It lived in this heredoc until 2026-08-16, where it could not be
          # unit-tested — and two defects survived review as a result: the object
          # NAME was interpolated straight into a filename (SCM names may contain
          # slashes, which wrote the record into a directory that does not
          # exist), and the record existed ONLY in the runner's filesystem, so a
          # failure in the PR step below lost the only trace of an irreversible
          # deletion.
          from fwgitops.evidence import build_manual_action, write_manual_action

          _vid = os.environ.get("VIOLATION_ID", "").strip()
          if _vid and _vid != "NONE" and not _vid.startswith("VIOL-"):
              print(f"::error::violation_id {_vid!r} must be a VIOL-... id or the "
                    f"word NONE")
              sys.exit(1)

          rec = build_manual_action(
              action="delete", kind=kind, folder=folder, name=name,
              object_id=obj.get("id"), tags=tags,
              reason=os.environ.get("REASON", ""),
              actor=os.environ.get("ACTOR", ""),
              run_url=os.environ.get("RUN_URL", ""),
              # Stated, not defaulted. This IS the workflow, so it is the one
              # caller entitled to say so.
              provenance="workflow",
              # `NONE` is TYPED, not left blank. A deletion that remediates
              # nothing the platform detected is a legitimate act (a fixture, a
              # cleanup) and exactly the one worth saying out loud — an empty
              # box would let it pass as an oversight.
              violation_id=None if _vid in ("", "NONE") else _vid,
              unlinked_reason=(
                  f"No detected violation. Operator stated NONE. {os.environ.get('REASON', '')}"
                  if _vid in ("", "NONE") else ""),
          )
          # PRINTED FIRST, and in full. The commit below can fail — an expired
          # token, a protected branch, a push race — and the object is already
          # gone by then. The log is the fallback copy of a record for something
          # that cannot be undone.
          # WRITE FIRST, THEN PRINT. The other order shipped, and on the first
          # real run the PRINT raised (NameError: _json — an alias that was
          # never imported), so the rule was deleted and NOTHING was recorded,
          # not even the fallback log copy this print exists to be. Writing
          # first means the weakest link cannot cost the record.
          f = write_manual_action(rec, pathlib.Path("evidence"))
          print("MANUAL ACTION RECORD:")
          print(json.dumps(rec, indent=2, sort_keys=True))
          print(f"recorded: {f}")
          PY

      # Lands by PR, like every other record here: `main` takes no direct push,
      # including from the pipeline.
      - name: Open a pull request with the record
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PR_TOKEN || github.token }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="manual-action/run-${GITHUB_RUN_ID}"
          git checkout -B "$branch"
          git add evidence/manual-actions/
          if git diff --cached --quiet; then
            echo "::error::nothing recorded — the delete step should have written a record"
            exit 1
          fi
          git commit -m "record: deleted ${NAME} from SCM (run ${GITHUB_RUN_ID})"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "record: deleted ${NAME} from SCM" \
            --body "An object GitOps did not own was removed directly in SCM. It could not go through the pipeline — Git has no representation of an object it never created — so this is the record of it. See \`evidence/manual-actions/\`." \
            || gh pr view "$branch" --json url >/dev/null
          gh pr merge "$branch" --squash --auto --delete-branch || true
