# ─────────────────────────────────────────────────────────────────────────
# The PR gate: fwgitops compile (fail-closed) + terraform plan per folder.
# SCM auth comes from the job env (secrets); the S3 state backend is reached via
# AWS OIDC. Plan-only — no device, no side effects — so it is safe on every PR.
# ─────────────────────────────────────────────────────────────────────────
name: pr-validate

# This workflow needs AWS OIDC + SCM credentials and runs a real plan, so it
# stays scoped to paths that can actually change the desired state. The unit
# tests are NOT here — they run unfiltered in test.yml, because filtering them
# meant a PR touching only tests/ or .github/ ran nothing at all.
on:
  workflow_dispatch: {}
  # NO `paths:` FILTER, DELIBERATELY. `compile-and-plan` is a REQUIRED status
  # check on `main`, and GitHub treats a required check that never runs as
  # pending forever — so a filtered-out PR cannot merge at all. That is the
  # deadlock, and it is not hypothetical: evidence-bundle PRs touch only
  # `evidence/`, which no filter here would have matched.
  #
  # The cost of running it on a docs-only PR is one `compile` and one `plan`
  # over an unchanged tree, about a minute. The cost of the filter is a class of
  # PR that can never be merged, or a required check quietly downgraded to
  # advisory to work around it.
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write # OIDC to cloud for the TF state backend (Arch-2)

jobs:
  compile-and-plan:
    runs-on: ubuntu-latest
    # SCM auth for the scm Terraform provider during plan (its own OAuth).
    env:
      SCM_CLIENT_ID: ${{ secrets.SCM_CLIENT_ID }}
      SCM_CLIENT_SECRET: ${{ secrets.SCM_CLIENT_SECRET }}
      SCM_SCOPE: ${{ secrets.SCM_SCOPE }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit is needed to materialise the BASELINE intent tree,
          # which is how a REMOVAL gets classified at all: a deleted intent is
          # absent from the current tree, so without a baseline nothing tiers it
          # and the gate never sees it.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      # Unit tests are NOT run here — test.yml runs them unfiltered on every
      # PR, so duplicating them would just double the wait on any src/ change.

      # 1. Fail-closed intent validation. Any invalid intent fails the PR here
      #    with an actionable report — the requester sees exactly what to fix.
      # THE CATALOG IS A HAND-MAINTAINED MIRROR of a hierarchy that changes
      # underneath it, and nothing verified the two until now. It has gone wrong
      # twice: device serials listed as child FOLDERS (v1.11.0), and a firewall
      # that left SCM entirely while the catalog kept listing it as targetable
      # (2026-08-05). Both produce the same failure — an intent that compiles
      # clean and dies at apply, past every compile-time check.
      #
      # Read-only. Objects in SCM the catalog does not mention are NOT reported:
      # Prisma Access built-ins are deliberately absent, and a check that cries
      # wolf every run gets ignored.
      - name: Verify the catalog against SCM
        run: fwgitops verify-catalog

      # A root must mirror the module ATTRIBUTE FOR ATTRIBUTE: Terraform
      # DISCARDS an undeclared object attribute at the module boundary silently
      # — no warning, exit 0 — so a drifted root does not fail, it quietly stops
      # delivering part of every intent. Fails the PR instead.
      - name: Terraform roots mirror the module
        run: fwgitops scaffold-root --check

      # MATERIALISE FOLDER INTERFACE VARIABLES FIRST, always before compile.
      # A folder's `$`-interface VARIABLES must exist before any zone in that
      # folder can bind one, and a GREENFIELD folder has no intents at all — so
      # this cannot be driven off the intent tree without being circular. The
      # source is catalog/interfaces.yaml, which is platform-maintained and
      # changed by PR, so a requester still cannot conjure a physical port.
      - name: Materialise folder interface variables (check)
        run: fwgitops folder-interfaces --check

      - name: Validate intent (fail-closed)
        run: fwgitops compile intent --check

      # 1b. Risk classification (Phase 2) — PR preview of each change's tier.
      #     Informational for now; the tier gate (LOW auto / HIGH review /
      #     CRITICAL dual-control) is wired on the apply side as it matures.
      # Materialise the BASE revision's intent tree. `git archive` rather than a
      # worktree: it is read-only, needs no cleanup, and cannot leave the
      # checkout on the wrong ref if the step fails midway.
      - name: Materialise the base intent tree
        env:
          # VIA env, NEVER spliced into the script with `${{ }}`. A PR title and
          # body are attacker-controlled text from anyone who can open a PR, and
          # `${{ }}` substitutes BEFORE bash parses the line — so a body holding
          # $(...) or backticks would EXECUTE in a job that can read the SCM
          # secrets. Quoted "$VAR" is data.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The PR TITLE + BODY, because a SQUASH merge is what lands on main and
          # that is the text `apply` reads for the `Removes:` trailer. Validating
          # individual commit messages here would pass a PR whose trailer never
          # reaches main — a real-looking check in front of an unauthorised apply.
          { printf '%s\n\n' "$PR_TITLE"; printf '%s\n' "$PR_BODY"; } > /tmp/change-message.txt
          mkdir -p /tmp/base-intent
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git archive "$BASE_SHA" intent | tar -x -C /tmp/base-intent
            echo "BASELINE=/tmp/base-intent/intent" >> "$GITHUB_ENV"
          else
            echo "::warning::base commit $BASE_SHA unavailable — removals will NOT be classified"
          fi

      # 1b. Risk classification (Phase 2) — PR preview of each change's tier,
      #     INCLUDING what the PR removes. A deletion is absent from the intent
      #     tree, so before --baseline nothing classified it: removing a rule
      #     that permits traffic and removing a route that carries it were both
      #     unassessed and auto-appliable.
      - name: Risk-classify (preview)
        run: |
          set -euo pipefail
          if [ -n "${BASELINE:-}" ]; then
            fwgitops classify intent --baseline "$BASELINE" \
              --change-message /tmp/change-message.txt
          else
            fwgitops classify intent
          fi

      # 1c. Enrich PREVIEW (dry-run, no SCM). The module is skeleton-only, so the
      #     terraform plan below does NOT show App-ID / profile / log-forwarding /
      #     ordering — enrich sets those. This surfaces them for review so the
      #     security-relevant fields aren't invisible in the PR. No side effects.
      - name: Enrich preview (dry-run)
        run: |
          set -euo pipefail
          for dir in terraform/*/; do
            folder=$(basename "$dir")
            case "$folder" in bootstrap-* | github-oidc | modules) continue ;; esac
            [ -f "$dir/main.tf" ] || continue
            fwgitops enrich "$folder" --dry-run | tee "enrich-$folder.txt"
          done

      # 2. Compile intents -> tfvars FRESH (a build artifact, not committed). The
      #    plan/preview steps below read these. Requesters never run this — they
      #    only edit intent/** and open the PR; CI compiles deterministically, so
      #    the reviewed intent is exactly what apply uses.
      # MATERIALISE FOLDER INTERFACE VARIABLES FIRST, always before compile.
      # A folder's `$`-interface VARIABLES must exist before any zone in that
      # folder can bind one, and a GREENFIELD folder has no intents at all — so
      # this cannot be driven off the intent tree without being circular. The
      # source is catalog/interfaces.yaml, which is platform-maintained and
      # changed by PR, so a requester still cannot conjure a physical port.
      - name: Materialise folder interface variables
        run: fwgitops folder-interfaces --out terraform

      - name: Compile (generate tfvars)
        run: fwgitops compile intent --out terraform

      # Every folder the compiler emitted MUST have a Terraform root. Both loops
      # below start with `[ -f "$dir/main.tf" ] || continue`, so a folder with
      # tfvars but no Terraform is SKIPPED, not caught — the plan never runs, the
      # undeclared-variable grep never runs, and the config silently never reaches
      # the device. `fwgitops compile` now fails closed on this too; this catches
      # hand-committed tfvars and terraform/ deletions the compile cannot see.
      - name: Guard — emitted tfvars must have a Terraform root
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in terraform/*/*.auto.tfvars.json; do
            d=$(dirname "$f")
            if [ ! -f "$d/main.tf" ]; then
              echo "::error::$(basename "$d"): compiled $(basename "$f") but there is no Terraform root in $d — the config would never be applied."
              exit 1
            fi
          done

      - uses: hashicorp/setup-terraform@v4

      # AWS creds for the S3 state backend (Arch-2), via OIDC — no stored keys.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-southeast-1

      # 3. terraform plan per Day-2 folder → the PR preview + drift signal.
      #    Plan needs no device and creates nothing, so it is the safe CI check.
      - name: terraform plan (per folder)
        run: |
          set -euo pipefail
          for dir in terraform/*/; do
            folder=$(basename "$dir")
            # Skip run-once bootstraps (local state) and the shared module dir.
            case "$folder" in bootstrap-* | github-oidc | modules) continue ;; esac
            [ -f "$dir/main.tf" ] || continue
            echo "::group::plan $folder"
            ./terraform/make-backend.sh "$folder"
            terraform -chdir="$dir" init -input=false -backend-config=backend.hcl

            # `|| true` used to swallow EVERY plan failure, and the pipe made
            # -detailed-exitcode meaningless (the exit code was tee's). A broken
            # plan passed CI silently. Capture the PLAN's status instead.
            #
            # -detailed-exitcode: 0 = no changes, 2 = changes present (NORMAL for
            # a PR — do not treat as failure), anything else = a real error.
            rc=0
            # -parallelism=1 REQUIRED, same reason as apply.yml: the scm provider
            # cannot handle concurrent token acquisition. A plan REFRESHES every
            # resource, so a folder with ~19 tag objects plus rules, zones and
            # routers issues exactly the concurrent burst that breaks it —
            # intermittent `403 Forbidden {"msg":"Access denied"}` on a tag read,
            # which looks like a permissions problem and is not. Observed in CI
            # 2026-08-05; the guard existed on apply from the start and was never
            # carried to plan.
            terraform -chdir="$dir" plan -input=false -no-color -detailed-exitcode \
              -parallelism=1 2>&1 | tee "plan-$folder.txt" || rc=$?
            case "$rc" in
              0|2) ;;
              *)
                echo "::error::terraform plan FAILED for $folder (exit $rc)"
                exit 1
                ;;
            esac

            # FAIL-CLOSED CONTRACT GUARD (defence in depth — NOT the primary check).
            #
            # The authoritative check is tfcontract.check_contract, enforced at
            # compile time in cli.py: it covers BOTH holes, including the
            # declared-but-unwired case that Terraform never warns about. This
            # grep is the backstop for the paths that check cannot see — stale
            # tfvars committed by hand, or terraform/ edited without recompiling.
            #
            # Terraform treats an auto-loaded *.auto.tfvars.json that sets an
            # UNDECLARED variable as a warning and exits 0. That is how a compiled
            # zones.auto.tfvars.json shipped for a full release while plan, apply
            # and 327 tests all stayed green and the config never reached the
            # firewall. A warning here means the compiler emitted data no module
            # consumes, so it must fail the PR.
            if grep -q "Value for undeclared variable" "plan-$folder.txt"; then
              echo "::error::$folder: compiled tfvars set a variable the Terraform module does not declare — the config would be SILENTLY IGNORED. Declare it in terraform/$folder/variables.tf and pass it to the module block."
              grep -n "Value for undeclared variable" "plan-$folder.txt" || true
              exit 1
            fi
            echo "::endgroup::"
          done

      # Strip credential values BEFORE anything is published. GitHub masks
      # secrets in the live log stream but NOT in artifact contents or in
      # `gh pr comment` bodies — and both are produced from files that capture
      # terraform's stderr while SCM_CLIENT_SECRET is in the job env. A provider
      # or auth error echoing a credential would land somewhere durable and
      # public while the visible log looked clean.
      #
      # always(): must run even when the plan step went red, because that is
      # exactly when an error message carrying a credential is most likely.
      - name: Redact credentials from published files
        if: always()
        run: python3 .github/scripts/redact.py plan-*.txt enrich-*.txt

      # always(): the plan step can now FAIL (it used to swallow everything with
      # `|| true`). A failing plan is exactly when the reviewer needs the output,
      # so the artifact must upload even though the previous step went red.
      - name: Upload plans
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-previews
          if-no-files-found: ignore
          path: |
            plan-*.txt
            enrich-*.txt

      - name: Comment plan summary on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Enrich preview (App-ID / profile / log-forwarding / ordering)"
            echo "_These fields are set by \`fwgitops enrich\` via the SCM API — the scm provider drops them, so they do NOT appear in the terraform plan below._"
            for f in enrich-*.txt; do
              [ -f "$f" ] || continue
              echo '```'; cat "$f"; echo '```'
            done
            echo "### Terraform plan (skeleton: zones / addresses / service / action / tags)"
            for f in plan-*.txt; do
              [ -f "$f" ] || continue
              echo "<details><summary>$f</summary>"
              echo '```'; tail -c 60000 "$f"; echo '```'
              echo "</details>"
            done
          } > body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file body.md
