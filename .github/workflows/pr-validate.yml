# ─────────────────────────────────────────────────────────────────────────
# The PR gate: fwgitops compile (fail-closed) + terraform plan per folder.
# SCM auth comes from the job env (secrets); the S3 state backend is reached via
# AWS OIDC. Plan-only — no device, no side effects — so it is safe on every PR.
# ─────────────────────────────────────────────────────────────────────────
name: pr-validate

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "intent/**"
      - "catalog/**"
      - "terraform/**"
      - "src/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write # OIDC to cloud for the TF state backend (Arch-2)

jobs:
  compile-and-plan:
    runs-on: ubuntu-latest
    # SCM auth for the scm Terraform provider during plan (its own OAuth).
    env:
      SCM_CLIENT_ID: ${{ secrets.SCM_CLIENT_ID }}
      SCM_CLIENT_SECRET: ${{ secrets.SCM_CLIENT_SECRET }}
      SCM_SCOPE: ${{ secrets.SCM_SCOPE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      # 0. Unit tests — a PR must not regress the compiler/enrich/classifier.
      - name: Run tests
        run: python -m pytest -q

      # 1. Fail-closed intent validation. Any invalid intent fails the PR here
      #    with an actionable report — the requester sees exactly what to fix.
      - name: Validate intent (fail-closed)
        run: fwgitops compile intent --check

      # 1b. Risk classification (Phase 2) — PR preview of each change's tier.
      #     Informational for now; the tier gate (LOW auto / HIGH review /
      #     CRITICAL dual-control) is wired on the apply side as it matures.
      - name: Risk-classify (preview)
        run: fwgitops classify intent

      # 1c. Enrich PREVIEW (dry-run, no SCM). The module is skeleton-only, so the
      #     terraform plan below does NOT show App-ID / profile / log-forwarding /
      #     ordering — enrich sets those. This surfaces them for review so the
      #     security-relevant fields aren't invisible in the PR. No side effects.
      - name: Enrich preview (dry-run)
        run: |
          set -euo pipefail
          for dir in terraform/*/; do
            folder=$(basename "$dir")
            case "$folder" in bootstrap-* | github-oidc | modules) continue ;; esac
            [ -f "$dir/main.tf" ] || continue
            fwgitops enrich "$folder" --dry-run | tee "enrich-$folder.txt"
          done

      # 2. Compile intents -> tfvars FRESH (a build artifact, not committed). The
      #    plan/preview steps below read these. Requesters never run this — they
      #    only edit intent/** and open the PR; CI compiles deterministically, so
      #    the reviewed intent is exactly what apply uses.
      - name: Compile (generate tfvars)
        run: fwgitops compile intent --out terraform

      - uses: hashicorp/setup-terraform@v4

      # AWS creds for the S3 state backend (Arch-2), via OIDC — no stored keys.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-southeast-1

      # 3. terraform plan per Day-2 folder → the PR preview + drift signal.
      #    Plan needs no device and creates nothing, so it is the safe CI check.
      - name: terraform plan (per folder)
        run: |
          set -euo pipefail
          for dir in terraform/*/; do
            folder=$(basename "$dir")
            # Skip run-once bootstraps (local state) and the shared module dir.
            case "$folder" in bootstrap-* | github-oidc | modules) continue ;; esac
            [ -f "$dir/main.tf" ] || continue
            echo "::group::plan $folder"
            ./terraform/make-backend.sh "$folder"
            terraform -chdir="$dir" init -input=false -backend-config=backend.hcl

            # `|| true` used to swallow EVERY plan failure, and the pipe made
            # -detailed-exitcode meaningless (the exit code was tee's). A broken
            # plan passed CI silently. Capture the PLAN's status instead.
            #
            # -detailed-exitcode: 0 = no changes, 2 = changes present (NORMAL for
            # a PR — do not treat as failure), anything else = a real error.
            rc=0
            terraform -chdir="$dir" plan -input=false -no-color -detailed-exitcode \
              2>&1 | tee "plan-$folder.txt" || rc=$?
            case "$rc" in
              0|2) ;;
              *)
                echo "::error::terraform plan FAILED for $folder (exit $rc)"
                exit 1
                ;;
            esac

            # FAIL-CLOSED CONTRACT GUARD (defence in depth — NOT the primary check).
            #
            # The authoritative check is tfcontract.check_contract, enforced at
            # compile time in cli.py: it covers BOTH holes, including the
            # declared-but-unwired case that Terraform never warns about. This
            # grep is the backstop for the paths that check cannot see — stale
            # tfvars committed by hand, or terraform/ edited without recompiling.
            #
            # Terraform treats an auto-loaded *.auto.tfvars.json that sets an
            # UNDECLARED variable as a warning and exits 0. That is how a compiled
            # zones.auto.tfvars.json shipped for a full release while plan, apply
            # and 327 tests all stayed green and the config never reached the
            # firewall. A warning here means the compiler emitted data no module
            # consumes, so it must fail the PR.
            if grep -q "Value for undeclared variable" "plan-$folder.txt"; then
              echo "::error::$folder: compiled tfvars set a variable the Terraform module does not declare — the config would be SILENTLY IGNORED. Declare it in terraform/$folder/variables.tf and pass it to the module block."
              grep -n "Value for undeclared variable" "plan-$folder.txt" || true
              exit 1
            fi
            echo "::endgroup::"
          done

      # always(): the plan step can now FAIL (it used to swallow everything with
      # `|| true`). A failing plan is exactly when the reviewer needs the output,
      # so the artifact must upload even though the previous step went red.
      - name: Upload plans
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-previews
          if-no-files-found: ignore
          path: |
            plan-*.txt
            enrich-*.txt

      - name: Comment plan summary on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Enrich preview (App-ID / profile / log-forwarding / ordering)"
            echo "_These fields are set by \`fwgitops enrich\` via the SCM API — the scm provider drops them, so they do NOT appear in the terraform plan below._"
            for f in enrich-*.txt; do
              [ -f "$f" ] || continue
              echo '```'; cat "$f"; echo '```'
            done
            echo "### Terraform plan (skeleton: zones / addresses / service / action / tags)"
            for f in plan-*.txt; do
              [ -f "$f" ] || continue
              echo "<details><summary>$f</summary>"
              echo '```'; tail -c 60000 "$f"; echo '```'
              echo "</details>"
            done
          } > body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file body.md
