# ─────────────────────────────────────────────────────────────────────────
# The PR gate: fwgitops compile (fail-closed) + terraform plan per folder.
# SCM auth comes from the job env (secrets); the S3 state backend is reached via
# AWS OIDC. Plan-only — no device, no side effects — so it is safe on every PR.
# ─────────────────────────────────────────────────────────────────────────
name: pr-validate

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "intent/**"
      - "catalog/**"
      - "terraform/**"
      - "src/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write # OIDC to cloud for the TF state backend (Arch-2)

jobs:
  compile-and-plan:
    runs-on: ubuntu-latest
    # SCM auth for the scm Terraform provider during plan (its own OAuth).
    env:
      SCM_CLIENT_ID: ${{ secrets.SCM_CLIENT_ID }}
      SCM_CLIENT_SECRET: ${{ secrets.SCM_CLIENT_SECRET }}
      SCM_SCOPE: ${{ secrets.SCM_SCOPE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e .

      # 1. Fail-closed intent validation. Any invalid intent fails the PR here
      #    with an actionable report — the requester sees exactly what to fix.
      - name: Validate intent (fail-closed)
        run: fwgitops compile intent --check

      # 1b. Risk classification (Phase 2) — PR preview of each change's tier.
      #     Informational for now; the tier gate (LOW auto / HIGH review /
      #     CRITICAL dual-control) is wired on the apply side as it matures.
      - name: Risk-classify (preview)
        run: fwgitops classify intent

      # 2. The committed rules.auto.tfvars.json must match a fresh compile, so
      #    the artifact reviewed in the PR is exactly what apply will use.
      - name: Check generated tfvars is up to date
        run: |
          fwgitops compile intent --out terraform
          if ! git diff --quiet -- 'terraform/**/rules.auto.tfvars.json'; then
            echo "::error::rules.auto.tfvars.json is stale. Run: fwgitops compile intent --out terraform, then commit."
            git --no-pager diff -- 'terraform/**/rules.auto.tfvars.json'
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v4

      # AWS creds for the S3 state backend (Arch-2), via OIDC — no stored keys.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-southeast-1

      # 3. terraform plan per Day-2 folder → the PR preview + drift signal.
      #    Plan needs no device and creates nothing, so it is the safe CI check.
      - name: terraform plan (per folder)
        run: |
          set -euo pipefail
          for dir in terraform/*/; do
            folder=$(basename "$dir")
            # Skip run-once bootstraps (local state) and the shared module dir.
            case "$folder" in bootstrap-* | github-oidc | modules) continue ;; esac
            [ -f "$dir/main.tf" ] || continue
            echo "::group::plan $folder"
            ./terraform/make-backend.sh "$folder"
            terraform -chdir="$dir" init -input=false -backend-config=backend.hcl
            terraform -chdir="$dir" plan -input=false -no-color -detailed-exitcode | tee "plan-$folder.txt" || true
            echo "::endgroup::"
          done

      - name: Upload plans
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plans
          path: plan-*.txt

      - name: Comment plan summary on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Terraform plan (PR preview)"
            for f in plan-*.txt; do
              [ -f "$f" ] || continue
              echo "<details><summary>$f</summary>"
              echo '```'; tail -c 60000 "$f"; echo '```'
              echo "</details>"
            done
          } > body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file body.md
