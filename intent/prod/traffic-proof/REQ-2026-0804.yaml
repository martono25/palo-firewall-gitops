# The first policy this platform has written that a PACKET will test.
#
# Every rule shipped so far references 10.20.x.x, which matches nothing in this
# VPC — they compile, apply, push and land on the device, but no traffic has ever
# been evaluated against one. This allows the east-west test hosts to talk:
#
#   10.100.3.200 (trust)  ->  10.100.2.200 (untrust)
#
# and those hosts are routed through the firewall by a route MORE SPECIFIC than
# the VPC local route, so the packet genuinely traverses it rather than going
# direct (see provisioning/aws-vmseries-pilot/traffic-test.tf).
#
# The test is deliberately run BEFORE this rule exists as well. If traffic is
# blocked without it and allowed with it, that rules out the failure this whole
# exercise is designed to catch: traffic taking a direct path and never touching
# the firewall at all, which would look like success for the wrong reason.
apiVersion: fw-intent/v1
kind: AccessRequest

metadata:
  id: REQ-2026-0804
  requester: martono@corp
  ticket: JIRA-905
  justification: >-
    Prove the GitOps pipeline produces working policy: allow the trust-side test
    host to reach the untrust-side target over HTTP and ICMP, evaluated by the
    firewall rather than by AWS routing.
  requested: "2026-08-04"

spec:
  environment: prod
  action: allow
  source:
    - cidr: 10.100.3.0/24
  destination:
    - cidr: 10.100.2.0/24
  service:
    - protocol: tcp
      port: "80"
  log: true
