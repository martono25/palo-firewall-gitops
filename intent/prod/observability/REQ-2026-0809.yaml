# ICMP through the pipeline for the first time (v1.40.0).
#
# Also the platform's own smoke test: until now every connectivity question had
# to be posed as a TCP service that may or may not answer on the far side, which
# is exactly the wrong-shaped test that cost hours on 2026-08-04.
#
# No `port` — ICMP has none, and one alongside `protocol: icmp` is REJECTED
# rather than ignored. Compiles to service `application-default` + application
# `ping` (measured: spike/icmp-service-shape).
apiVersion: fw-intent/v1
kind: AccessRequest
metadata:
  id: REQ-2026-0809
  requester: martono@corp
  ticket: JIRA-21002
  justification: "Estate-wide availability sweep: the collector must ping every host in 10.20.0.0/16, not just the web host"
  requested: 2026-08-13
spec:
  environment: prod
  action: allow
  source:
    - cidr: 10.20.20.10/32     # the collector
  destination:
    - cidr: 10.20.0.0/16       # the whole estate, for the sweep
  service:
    - protocol: icmp
  log: true
