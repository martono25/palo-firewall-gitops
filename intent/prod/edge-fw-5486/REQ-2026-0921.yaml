# Day-1 interface addressing for fw-prod-edge-5486 (ADR-0001 kind #3, ADR-0005).
#
# Replaces REQ-2026-0911, which addressed the retired 007955000919340 — deleted from CSP on
# 2026-10-10 ahead of the AWS account change (JIRA-9700). A new request, not an
# edit: the old one authorised addressing a different firewall, and its evidence
# stays true of that one.
#
# ADDRESS MUST MATCH THE ENI. On AWS the firewall only receives traffic on an
# interface configured with the private IP AWS assigned to its ENI — anything
# else is configured but silent. ethernet1/2 is ENI device index 2 (untrust subnet 10.100.2.0/24), which AWS
# assigned 10.100.2.77 on this instance (i-0a6350610ba41fbf2, read with
# describe-network-interfaces 2026-10-10 — NOT carried over: the retired
# firewall's ENIs held different addresses in a different account).
apiVersion: fw-intent/v1
kind: InterfaceRequest

metadata:
  id: REQ-2026-0921
  requester: martono@corp.com
  ticket: JIRA-9710
  justification: >-
    Day-1 build for replacement edge firewall fw-prod-edge-5486 in AWS account 975239810400: address the outside interface so the internet zone can carry traffic.
  requested: "2026-10-10"

spec:
  device: "007955000935486"     # fw-prod-edge-5486, PA-VM, connected
  interface: internet      # role — resolved via catalog/interfaces.yaml
  ip:
    - 10.100.2.77/24
  mtu: 1500
  comment: "Outside — managed by fwgitops"
