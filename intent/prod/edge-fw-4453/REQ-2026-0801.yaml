# Day-1 interface addressing for ONE firewall (ADR-0001 kind #3, ADR-0005).
#
# Targets `device:` rather than `folder:` — the narrowest scope that reaches
# hardware. Verified in spike/device-override-probe: a device-scope write to an
# interface inherited from ngfw-shared creates a PER-DEVICE OVERRIDE with its own
# id, leaving the shared object, the other firewall (007955000893662) and the
# parent folders untouched. Deleting it reverts to inheritance.
#
# `interface:` names a ROLE, not a port. The same interface is `$eth-local` at
# folder scope and `ethernet1/4` at device scope (ADR-0005), so no literal is
# correct for both — and the physical name is a property of the AWS topology,
# which has already changed once. catalog/interfaces.yaml resolves the role for
# whichever scope this intent targets.
#
# ADDRESS MUST MATCH THE ENI. On AWS the firewall only receives traffic on an
# interface configured with the private IP AWS assigned to its ENI — anything
# else is configured but silent. The `trust` ENI (device index 4, subnet
# 10.100.3.0/24) holds 10.100.3.125, so that is the address here.
#
# This first shipped as 10.20.0.1/24, which matched no subnet in the VPC. It was
# a valid proof of the GitOps chain — it reached the running config — but it
# could never have passed a packet.
apiVersion: fw-intent/v1
kind: InterfaceRequest

metadata:
  id: REQ-2026-0801
  requester: martono@corp
  ticket: JIRA-902
  justification: >-
    Day-1 build for edge firewall fw-prod-edge-4453: give the internal interface
    its address so the local zone can carry traffic. First GitOps-managed
    data-plane change on hardware.
  requested: "2026-08-02"

spec:
  device: "007955000894453"     # fw-prod-edge-4453, PA-VM, connected
  interface: local              # role — resolved via catalog/interfaces.yaml
  ip:
    - 10.100.3.125/24
  mtu: 1500
  comment: "Internal — managed by fwgitops"
