# Default route for the edge firewall (ADR-0001 kind #4).
#
# TARGETS A FOLDER, NOT THE FIREWALL. SCM creates logical routers at folder
# scope only: `device=` is accepted on GET and rejected on POST with a
# misleading "Device ... doesn't exist" (verified live 2026-08-04,
# spike/router-device-naming). So this lands in `prod-edge`, which the firewall
# inherits from — and the compiler refuses `device:` on a RouteRequest rather
# than letting it compile and die at apply.
#
# WHAT THIS CREATES. `prod-edge` currently INHERITS its `default` router from
# ngfw-shared. Writing a route here creates a local override, so prod-edge
# becomes the owner of the object every packet traverses. The classifier fires
# `router_becomes_locally_owned` (HIGH) for exactly that reason, alongside
# `default_route` (HIGH) — this decides where all unmatched traffic goes.
#
# VRF MEMBERSHIP IS NOT OPTIONAL. Terraform manages whole objects and a router
# holds both its routes AND its interface list, so the compiler carries
# membership from catalog/routers.yaml on every compiled route and re-asserts it
# on aggregation. Writing this router without [$eth-local, $eth-internet] would
# empty the VRF and break routing wholesale — the reason RouteRequest is the
# first kind whose failure mode is an outage rather than a no-op.
#
# NEXT HOP is the AWS subnet router for the untrust segment (10.100.2.0/24),
# which is always .1 — the firewall's own outside address is 10.100.2.142.
apiVersion: fw-intent/v1
kind: RouteRequest

metadata:
  id: REQ-2026-0803
  requester: martono@corp
  ticket: JIRA-912
  justification: >-
    Day-1 build for edge firewall fw-prod-edge-4453: default route out the
    untrust interface so the firewall can forward unmatched traffic. Completes
    the ADR-0002 Day-1 chain (Interface -> Zone -> Route) on hardware.
  requested: "2026-08-13"

spec:
  folder: prod-edge
  destination: 0.0.0.0/0
  nexthop: 10.100.2.1           # AWS subnet router for 10.100.2.0/24
  metric: 10
