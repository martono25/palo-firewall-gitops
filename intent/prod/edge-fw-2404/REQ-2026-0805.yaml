# Address the DMZ interface (ADR-0001 kind #3, ADR-0005).
#
# First half of the pair that finally puts a ZoneRequest on hardware. Zones bind
# interfaces, so the interface has to exist and be addressed before the zone
# that carries it means anything — the ordering ADR-0002 declares and v1.17.0
# enforces (`InterfaceRequest` -> `ZoneRequest`).
#
# `interface: dmz` is a ROLE. Unlike `local` and `internet`, whose `$eth-*`
# variables are SCM defaults inherited from ngfw-shared, this role's variable
# `$eth-dmz` is created by terraform/bootstrap-scm-folder. That is a real
# boundary in the design: the Day-1 kinds CONFIGURE interfaces, they do not
# create them.
#
# ADDRESS MUST MATCH THE ENI. AWS delivers traffic only to the interface holding
# the private IP it assigned. ethernet1/2 is device index 2, in subnet
# 10.100.1.0/24, holding 10.100.1.110.
apiVersion: fw-intent/v1
kind: InterfaceRequest

metadata:
  id: REQ-2026-0805
  requester: martono@corp
  ticket: JIRA-9321
  justification: >-
    Address the DMZ interface on fw-prod-edge-2404 so the dmz zone declared by
    REQ-2026-0806 binds a real, addressed port. Closes the last Day-1 kind that
    had never been verified on hardware.
  requested: "2026-08-12"

spec:
  device: "007955000902404"     # fw-prod-edge-4453, PA-VM, connected
  interface: dmz                # role — $eth-dmz / ethernet1/3
  ip:
    - 10.100.1.110/24
  mtu: 1500
  comment: "DMZ — managed by fwgitops"
